<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href='data:application/manifest+json,{"name":"FORGE — programme, souplesse & journal","short_name":"Forge","display":"standalone","background_color":"#0c0f0e","theme_color":"#0c0f0e","start_url":"."}'>
<title>FORGE — programme de coach, souplesse guidée & journal</title>
<style>
  :root{
    --bg:#0c0f0e; --bg2:#141a18; --bg3:#1c2422; --line:#2a352f;
    --txt:#e9f2ee; --dim:#8aa39a;
    --acc:#5ad1a5; --accd:#2fae86;
    --muscu:#5b9cff; --boxe:#ff5c6c; --jour:#f5b840; --autre:#8aa39a;
    --ok:#3ecf7a; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 130px}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:2px}
  .logo span{color:var(--acc)}
  .badge{font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#122019,#132a24)}
  .hero .lvl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .hero .lvlname{font-size:22px;font-weight:800;margin:2px 0 6px;color:var(--acc)}
  .hero p{font-size:13px;color:var(--dim);line-height:1.5}

  .btn{display:block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#062018;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;margin-top:0;display:inline-block}
  .btn.danger{background:#3a1a20;color:var(--boxe);border:1px solid #55232c}
  .btn.blue{background:var(--muscu);color:#04122e}
  h1.page{font-size:22px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--dim);font-size:13px;line-height:1.5}
  .cat{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 8px;font-weight:700}

  /* blocs programme */
  .pblock{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
  .pblock .pe{font-size:24px;flex-shrink:0}
  .pblock .pt{flex:1;min-width:0}
  .pblock .pt b{font-size:15px;display:block}
  .pblock .pt small{color:var(--dim);font-size:12px}
  .pblock .pgo{background:var(--bg3);border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
  .pblock .pck{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0}
  .pblock.done{opacity:.6}
  .pblock.done .pck{background:#12261e;color:var(--ok);border-color:#1d4a31}

  /* routines / workouts */
  .rout{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
  .rout .rh{display:flex;align-items:center;gap:12px}
  .rout .ri{font-size:26px}
  .rout .rtx{flex:1;min-width:0}
  .rout .rtx b{font-size:16px;display:block}
  .rout .rtx small{color:var(--dim);font-size:12px}
  .rout .chev{color:var(--dim);padding:6px;font-size:14px}
  .rout .steps{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .rout.open .steps{display:block}
  .rout .steps .st{display:flex;gap:10px;padding:7px 0;font-size:13px;color:#cfe0d9;align-items:baseline}
  .rout .steps .st span{color:var(--dim);font-size:12px;min-width:62px}
  .rout .steps .st em{color:var(--dim);font-style:normal;margin-left:auto;font-size:12px;text-align:right}
  .rout .steps .rnote{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#b9c7d6;line-height:1.55;margin-bottom:10px}
  .rout .steps .st{align-items:flex-start}
  .rout .steps .st .stc{flex:1}
  .rout .steps .st .stc .z{color:var(--dim);font-style:normal;font-size:12px}
  .rout .steps .st .stwhy{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:3px}
  .pwhy{color:#b9c7d6;font-size:12.5px;line-height:1.55;margin-top:14px;max-width:520px;padding:12px 10px 0;border-top:1px solid var(--line)}

  /* test du sol */
  .floor{display:flex;align-items:center;gap:14px}
  .floor .big{font-size:34px}
  .floor .ft{flex:1}.floor .ft b{font-size:16px;display:block}.floor .ft small{color:var(--dim);font-size:12px}
  .levels{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .lvlopt{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;font-weight:600;font-size:15px}
  .lvlopt.on{border-color:var(--acc);background:#12261e}
  .lvlopt .n{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dim);flex-shrink:0}
  .lvlopt.on .n{background:var(--acc);color:#062018;border-color:var(--acc)}

  /* séance muscu */
  .sesshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sesshead b{font-size:18px}
  .sesshead .chrono{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700}
  .warm{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .warm b{font-size:14px}
  .warm ul{list-style:none;margin-top:8px}
  .warm li{font-size:13px;color:#cfe0d9;padding:4px 0 4px 18px;position:relative;line-height:1.4}
  .warm li::before{content:'•';position:absolute;left:4px;color:var(--acc)}
  .exo{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .exo .xh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .exo .xh b{flex:1;font-size:15px}
  .exo .xh .zone{color:var(--muscu);font-size:11px;font-weight:700}
  .exo .presc{font-size:12px;color:var(--acc);font-weight:700;margin:2px 0 6px}
  .exo .tip{font-size:12px;color:var(--dim);margin-bottom:4px;line-height:1.45}
  .exo .progn{font-size:12px;color:#9ec6b6;line-height:1.45;margin-bottom:8px}
  .exo .progn b{color:var(--acc)}
  .exo .last{font-size:12px;color:var(--dim);margin-bottom:8px}
  .exo .last b{color:var(--acc)}
  .setrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .setrow .sn{width:22px;text-align:center;color:var(--dim);font-weight:700;font-size:13px;flex-shrink:0}
  .fld{flex:1;display:flex;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .fld button{width:44px;height:46px;background:none;border:none;color:var(--dim);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0}
  .fld input{flex:1;width:30px;background:none;border:none;color:var(--txt);font-size:17px;font-weight:800;text-align:center;outline:none}
  .fld small{color:var(--dim);font-size:10px;padding-right:10px}
  .setrow .ck{width:48px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0}
  .setrow.done .ck{background:#12261e;color:var(--ok);border-color:#1d4a31}
  .setrow.done .fld{opacity:.5}
  .addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:9px;width:100%;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}

  /* journal */
  .discgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0 4px}
  .discbtn{border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--bg3)}
  .discbtn:active{transform:scale(.96)}
  .discbtn .i{font-size:22px;display:block;margin-bottom:3px}
  .discbtn b{font-size:12px}
  .discbtn.on{border-width:2px}
  textarea,input.txt{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;resize:vertical;margin-top:10px}
  textarea{min-height:64px;line-height:1.5}
  label.fl{font-size:12px;color:var(--dim);font-weight:700;display:block;margin-top:14px}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  input.txt[type=date],input.txt[type=number]{margin-top:6px}
  .rpe{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .rpe i{width:calc((100% - 45px)/10);min-width:26px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .rpe i.on{background:var(--acc);color:#062018;border-color:var(--acc)}
  .entry{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .entry .eh{display:flex;align-items:center;gap:10px}
  .entry .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg3)}
  .entry .et{flex:1;min-width:0}.entry .et b{font-size:15px;display:block}.entry .et small{color:var(--dim);font-size:12px}
  .entry .del{color:var(--dim);padding:4px 8px;cursor:pointer}
  .entry .body{margin-top:10px;font-size:14px;line-height:1.55;color:#cfe0d9}
  .entry .body .lab{color:var(--dim);font-size:12px;font-weight:700;display:block;margin-top:6px}

  /* progress */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--acc)}.stat small{color:var(--dim);font-size:12px}
  .heatwrap{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;margin-top:10px}
  .heat i{width:13px;height:13px;border-radius:3px;background:var(--bg3)}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--dim);font-weight:700;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  .prrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .prrow:last-child{border-bottom:none}
  .prrow .t{flex:1;min-width:0}.prrow b{font-size:14px;display:block}.prrow small{color:var(--dim);font-size:12px}
  .prrow .val{font-weight:800;color:var(--acc);font-size:15px}
  svg.chart{width:100%;height:130px;margin-top:8px}
  .empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px;line-height:1.7}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,14,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:10.5px;font-weight:700;cursor:pointer}
  nav button .i{display:block;font-size:19px;margin-bottom:2px}
  nav button.on{color:var(--acc)}

  #toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-90px);background:var(--bg3);border:1px solid var(--acc);color:var(--txt);padding:12px 22px;border-radius:14px;font-weight:700;z-index:100;transition:transform .35s;font-size:15px;max-width:92%;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}

  #restbar{position:fixed;bottom:70px;left:0;right:0;z-index:45;display:none}
  #restbar .in{max-width:520px;margin:0 auto;padding:0 12px}
  #restbar .box{background:#12261e;border:1px solid #1d4a31;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
  #restbar b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--ok)}
  #restbar .bar{flex:1;height:6px;background:#0006;border-radius:3px;overflow:hidden}
  #restbar .bar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
  #restbar button{background:none;border:none;color:var(--dim);font-weight:700;cursor:pointer;font-size:13px}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .inner{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .topbar .back{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}
  .topbar b{font-size:16px}

  .player{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 30px;min-height:100vh;display:flex;flex-direction:column}
  .ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .ptop .pquit{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .ptop .pprog{color:var(--dim);font-size:13px;font-weight:700}
  .pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .pbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
  .pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .plabel{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .pstage.hold .plabel{color:var(--acc)}
  .ring{width:172px;height:172px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px 0 4px;transition:background .3s}
  .ringin{width:152px;height:152px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .ptime{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}
  .pname{font-size:22px;font-weight:800}
  .pzone{font-size:13px;color:var(--acc);font-weight:700}
  .pcue{font-size:15px;color:#cfe0d9;line-height:1.55;max-width:420px;margin-top:6px}
  /* illustrations de posture (SVG inline) */
  .posewrap{width:100%;display:flex;justify-content:center;margin:4px 0 2px}
  .posefig{width:min(82%,290px);height:auto;max-height:158px;display:block}
  .posefig .b{fill:none;stroke:#dbe9e2;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .posefig .h{fill:#dbe9e2}
  .posefig .m{fill:none;stroke:var(--acc);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round}
  .posefig .fl,.posefig .w{stroke:#4b5b54;stroke-width:3;stroke-linecap:round}
  .posefig .ar{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round}
  .posefig .ard{fill:var(--acc)}
  .posefig .g{fill:none;stroke:#8aa79b;stroke-width:2;stroke-dasharray:3 4}
  .stfig{flex:0 0 auto;width:50px;height:38px;margin-right:2px}.stfig .posefig{width:50px;max-height:38px}
  .pctrl{display:flex;gap:10px;margin-top:18px}
  .pctrl .pbtn{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:15px 8px;font-size:14px;font-weight:700;cursor:pointer}
  .pctrl .pbtn.main{flex:1.4;background:var(--acc);color:#062018}
  .pctrl .pbtn:active{transform:scale(.97)}
  .pdone{text-align:center;padding:30px 0}.pdone .big{font-size:60px}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">FOR<span>GE</span></div><div class="badge" id="streakBadge">🔥 0 j</div></header>
  <main id="main"></main>
  <nav><div class="in">
    <button data-tab="today" class="on"><span class="i">📅</span>Aujourd'hui</button>
    <button data-tab="sess"><span class="i">🏋️</span>Séances</button>
    <button data-tab="jour"><span class="i">📓</span>Journal</button>
    <button data-tab="prog"><span class="i">📈</span>Progrès</button>
  </div></nav>
</div>
<div id="restbar"><div class="in"><div class="box"><b id="restT">1:30</b><div class="bar"><i id="restI"></i></div><button id="restSkip">Passer ›</button></div></div></div>
<div class="overlay" id="overlay"><div class="inner" id="overlayInner"></div></div>
<div class="overlay" id="player"></div>
<div id="toast"></div>

<script>
/* ================================================================
   FORGE — programme de coach · souplesse guidée · muscu · journal
   ================================================================ */
const PIANO_URL='https://niclaeysthomas-ctrl.github.io/piano-dojo/';

/* ---------------- souplesse ---------------- */
const ROUTINES=[
  { id:'reveil', emoji:'🌅', nom:'Réveil du matin', focus:'Réveil musculaire + amorce souplesse', prep:5,
    note:"À froid, le corps est raide et les disques vertébraux gorgés d'eau : on bouge en amplitude progressive, jamais en force. Le vrai gain de souplesse se fait à chaud (séances dédiées). Ici, on réveille, on lubrifie les articulations, on lance la machine — puis on finit par une amorce douce vers le sol.",
    steps:[
    {emoji:'🌬️',nom:"Respiration + grandissement",zone:"Réveil / posture",dyn:true,sec:30,cue:"Debout, inspire par le nez en étirant la colonne vers le haut, souffle long par la bouche.",why:"Active le diaphragme et le système nerveux en douceur avant l'effort."},
    {emoji:'🙆',nom:"Cercles de nuque",zone:"Cou",dyn:true,sec:20,cue:"Demi-cercles lents d'une épaule à l'autre, sans écraser l'arrière du cou.",why:"Lubrifie les cervicales, raides au réveil."},
    {emoji:'🔄',nom:"Cercles d'épaules & bras",zone:"Épaules",dyn:true,sec:30,cue:"Grands cercles des bras vers l'arrière, de plus en plus amples.",why:"Chauffe la coiffe des rotateurs et ouvre la poitrine, contre le dos rond."},
    {emoji:'🐈',nom:"Chat–vache",zone:"Colonne",dyn:true,sec:40,cue:"À quatre pattes, alterne dos rond (souffle) et dos creux (inspire).",why:"Mobilise la colonne étage par étage : le meilleur réveil du dos, sans charge."},
    {emoji:'🌀',nom:"Rotations du tronc",zone:"Mobilité thoracique",dyn:true,sec:30,cue:"Bassin fixe, tourne les épaules de gauche à droite, bras relâchés qui fouettent.",why:"Le haut du dos s'enraidit assis : le mobiliser protège lombaires et épaules."},
    {emoji:'🔄',nom:"Cercles de hanches",zone:"Hanches",dyn:true,sec:30,cue:"Grands cercles du bassin, dans les deux sens.",why:"Prépare l'articulation la plus sollicitée de ta journée."},
    {emoji:'🦵',nom:"Balancés de jambe",zone:"Ischios (dynamique)",dyn:true,sec:25,sides:true,cue:"Appuie-toi, balance une jambe tendue d'avant en arrière, amplitude qui grandit.",why:"L'étirement dynamique gagne de l'amplitude sans figer le muscle à froid."},
    {emoji:'🐒',nom:"Squat profond tenu",zone:"Hanches & chevilles",sec:40,cue:"Descends en squat complet, talons au sol, coudes qui écartent les genoux. Respire.",why:"Position de repos naturelle de l'humain : restaure la mobilité qu'on perd sur une chaise."},
    {emoji:'⬇️',nom:"Déroulé vers le sol",zone:"Chaîne postérieure",sec:40,cue:"Genoux souples, déroule la colonne vertèbre par vertèbre vers le sol, nuque lâche.",why:"Amorce douce du « toucher le sol » — genoux fléchis pour ménager les disques le matin."},

const todayStr=()=>new Date().toISOString().slice(0,10);

function activityDays(){ const s=new Set(); S.mobLog.forEach(m=>s.add(m.date)); S.workoutLog.forEach(w=>s.add(w.date)); S.journal.forEach(j=>s.add(j.date)); return s; }
function dayStreak(){ const days=activityDays(); const ds=x=>x.toISOString().slice(0,10);
  let d=new Date(),n=0; if(!days.has(ds(d))) d.setDate(d.getDate()-1);
  while(days.has(ds(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function curFloor(){ return S.floorTests.length? S.floorTests[S.floorTests.length-1].level : null; }

/* ---------------- audio ---------------- */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} return AC; }
function beep(f=880,dur=.12,vol=.4,when=0){ const ctx=ac(); if(!ctx)return;
  const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.02); }
function bell(){ beep(587,.4,.5); beep(784,.5,.4,.06); if(navigator.vibrate)navigator.vibrate([100,50,100]); }
function tick(){ beep(1150,.05,.22); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }

      if(this.left<=0){ this.stop(); bell(); toast('💪 Repos terminé — série suivante.'); }
      else { if(this.left<=3) tick(); this.draw(); } },1000); },

function lastWk(ex){ for(let i=S.workoutLog.length-1;i>=0;i--){
  const e=(S.workoutLog[i].entries||[]).find(x=>x.ex===ex); if(e&&e.sets.length) return {date:S.workoutLog[i].date, sets:e.sets}; } return null; }
function startWorkout(w, planId=null){
  ac();
  S.curWk={ id:w.id, nom:w.nom, planId, warm:w.warm||[], start:Date.now(),
    entries:w.ex.map(e=>{ const lp=lastWk(e.nom); const base=lp?lp.sets[0]:(e.start||10);
      return { ex:e.nom, zone:e.zone, rep:e.rep, tempo:e.tempo, rest:e.rest, rpe:e.rpe, tip:e.tip, prog:e.prog,
        sets:[...Array(e.sets)].map(()=>({reps:base,done:false})) }; }) };
  save(); curTab='sess'; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='sess')); render();
}
let wkChrono=null;
function renderWkSession(){
  clearInterval(wkChrono); const c=S.curWk;

  main.querySelector('#fin').onclick=finishWorkout;
  main.querySelector('#ann').onclick=()=>{ if(confirm('Annuler ? Rien ne sera enregistré.')){ S.curWk=null; save(); Rest.stop(); render(); } };

function wkSetRow(en,st,si){
  const r=document.createElement('div'); r.className='setrow'+(st.done?' done':'');
  r.innerHTML=`<span class="sn">${si+1}</span>
    <div class="fld"><button data-a="-">−</button><input type="number" inputmode="numeric" value="${st.reps}"><small>reps</small><button data-a="+">+</button></div>
    <button class="ck">${st.done?'✓':'○'}</button>`;
  const inp=r.querySelector('input');
  inp.onchange=()=>{ st.reps=Math.max(0,+inp.value||0); save(); };
  r.querySelectorAll('.fld button').forEach(b=>b.onclick=()=>{ st.reps=Math.max(0,st.reps+(b.dataset.a==='+'?1:-1)); inp.value=st.reps; save(); });
  r.querySelector('.ck').onclick=()=>{ st.done=!st.done; save();
    r.classList.toggle('done',st.done); r.querySelector('.ck').textContent=st.done?'✓':'○';
    if(st.done){ if(navigator.vibrate)navigator.vibrate(40); Rest.start(en.rest||S.restDur); } };
  return r;
}
function finishWorkout(){
  const c=S.curWk;
  const entries=c.entries.map(en=>({ex:en.ex,zone:en.zone,sets:en.sets.filter(s=>s.done).map(s=>({reps:s.reps}))})).filter(en=>en.sets.length);
  if(!entries.length) return toast('Valide au moins une série (✓) avant de terminer.');
  const dur=Math.max(1,Math.round((Date.now()-c.start)/60000)); const newPR=[];
  entries.forEach(en=>{ const best=Math.max(...en.sets.map(s=>s.reps)); const old=S.prReps[en.ex];
    if(best>0 && (!old||best>old.reps)){ S.prReps[en.ex]={reps:best,date:todayStr()}; newPR.push(en.ex); } });
  S.workoutLog.push({id:Date.now(),date:todayStr(),nom:c.nom,dur,entries});
  if(c.planId) markPlan(c.planId);
  const totReps=entries.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.reps,0),0), totSets=entries.reduce((a,e)=>a+e.sets.length,0);
  S.curWk=null; save(); Rest.stop(); clearInterval(wkChrono); updateHeader();
  openCustom('Séance terminée',(inner,close)=>{
    inner.insertAdjacentHTML('beforeend',`<div style="text-align:center;padding:8px 0">
      <div style="font-size:54px">💪</div><div style="font-size:22px;font-weight:800;margin:6px 0">${c.nom}</div>
      <p class="sub">${dur} min · ${totSets} séries · ${totReps} répétitions</p>
      ${newPR.length?`<div style="margin-top:14px;background:var(--bg2);border:1px solid var(--acc);border-radius:12px;padding:12px;text-align:left">🏆 <b>Record${newPR.length>1?'s':''} de reps :</b> ${newPR.map(e=>e+' ('+S.prReps[e].reps+')').join(' · ')}</div>`:''}
      <p class="sub" style="margin-top:14px">${dayStreak()} jour(s) d'affilée 🔥</p></div>`);
    const ok=document.createElement('button'); ok.className='btn'; ok.textContent='OK'; ok.onclick=()=>{ close(); render(); }; inner.appendChild(ok);
  });
  bell();
}

/* ---------------- lecteur guidé (souplesse + gainage) ---------------- */
function startRoutine(routine, planId=null){
  ac(); const phases=[];
  const prep = routine.prep || 8;              // temps de mise en place avant chaque exercice
  const sideSwitch = Math.min(prep, 8);        // transition pour changer de côté
  routine.steps.forEach(s=>{ phases.push({kind:'prep',sec:prep,s});
    if(s.sides){ phases.push({kind:'hold',side:'gauche',sec:s.sec,s}); phases.push({kind:'switch',sec:sideSwitch,s}); phases.push({kind:'hold',side:'droite',sec:s.sec,s}); }
    else phases.push({kind:'hold',sec:s.sec,s}); });
  const holdTotal=phases.filter(p=>p.kind==='hold').length;
  let idx=0,left=phases[0].sec,paused=false,timer=null,started=Date.now(),wl=null;
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  player.classList.add('open'); player.scrollTop=0;
  const holdNo=i=>{ let n=0; for(let k=0;k<=i;k++) if(phases[k].kind==='hold') n++; return n; };
  function paint(){ const p=phases[idx], isTrans=(p.kind==='prep'||p.kind==='switch'); const deg=Math.max(0,Math.min(360,(1-left/p.sec)*360));
    const doneHolds=isTrans?holdNo(idx):holdNo(idx)-1; const displayNo=Math.min(holdTotal,isTrans?holdNo(idx)+1:holdNo(idx));
    const nextSide=isTrans && phases[idx+1] ? phases[idx+1].side : null;
    let label;
    if(p.kind==='prep') label='Prépare-toi'+(nextSide?' · côté '+nextSide:'');
    else if(p.kind==='switch') label='Change de côté'+(nextSide?' · '+nextSide:'');
    else label=(p.s.dyn?'En mouvement':'Maintiens')+(p.side?' · côté '+p.side:'');
    player.innerHTML=`<div class="player">
      <div class="ptop"><button class="pquit">✕ Quitter</button><span class="pprog">${routine.emoji} ${displayNo}/${holdTotal}</span></div>
      <div class="pbar"><i style="width:${doneHolds/holdTotal*100}%"></i></div>
      <div class="pstage ${isTrans?'prep':'hold'}">
        <div class="plabel">${label}</div>
        ${(()=>{const fig=poseSVG(p.s);return fig?`<div class="posewrap">${fig}</div>`:'';})()}
        <div class="ring" style="background:conic-gradient(${isTrans?'var(--dim)':'var(--acc)'} ${deg}deg, var(--bg3) 0)"><div class="ringin"><div class="ptime">${left}</div></div></div>
        <div class="pname">${p.s.emoji} ${p.s.nom}</div><div class="pzone">${p.s.zone}</div><div class="pcue">${p.s.cue}</div>${p.s.why?`<div class="pwhy">🔬 ${p.s.why}</div>`:''}</div>
      <div class="pctrl"><button class="pbtn" data-a="prev">‹ Préc.</button>
        <button class="pbtn main" data-a="pause">${paused?'▶ Reprendre':'❚❚ Pause'}</button>
        <button class="pbtn" data-a="next">Passer ›</button></div></div>`;
    player.querySelector('.pquit').onclick=quit;
    player.querySelector('[data-a="prev"]').onclick=()=>goto(idx-1);
    player.querySelector('[data-a="next"]').onclick=()=>goto(idx+1);
    player.querySelector('[data-a="pause"]').onclick=()=>{ paused=!paused; paint(); }; }
  function goto(i){ if(i<0)i=0; if(i>=phases.length){ finish(); return; } idx=i; left=phases[idx].sec; cue(phases[idx]); paint(); }
  function cue(p){ if(p.kind==='hold') beep(660,.25,.4); else beep(440,.15,.3); if(navigator.vibrate)navigator.vibrate(30); }
  function step(){ if(paused)return; left--;
    if(left<=0){ if(idx>=phases.length-1){ finish(); return; } idx++; left=phases[idx].sec; cue(phases[idx]); }
    else if(left<=3){ tick(); } paint(); }
  function stopAll(){ clearInterval(timer); try{wl?.release();}catch(e){} wl=null; }
  function quit(){ if(confirm('Quitter la séance ? Elle ne sera pas enregistrée.')){ stopAll(); player.classList.remove('open'); } }
  function finish(){ stopAll(); bell(); setTimeout(bell,350); const dur=Math.max(1,Math.round((Date.now()-started)/60000));
    S.mobLog.push({id:Date.now(),date:todayStr(),routine:routine.nom,dur}); if(planId) markPlan(planId); save(); updateHeader();
    player.innerHTML=`<div class="player"><div class="pdone"><div class="big">${routine.emoji}</div>
      <div style="font-size:24px;font-weight:800;margin:8px 0">Séance terminée</div>
      <p class="sub">${routine.nom} · ${dur} min · ${dayStreak()} jour(s) d'affilée 🔥</p>
      <p class="sub" style="margin-top:14px">La régularité fait tout. Reviens demain.</p>
      <button class="btn" id="pclose" style="margin-top:20px">Terminer</button></div></div>`;
    player.querySelector('#pclose').onclick=()=>{ player.classList.remove('open'); render(); }; }
  cue(phases[0]); paint(); timer=setInterval(step,1000);
}

  form.querySelectorAll('.discbtn').forEach(b=>b.onclick=()=>{ draftDisc=b.dataset.d;
    form.querySelectorAll('.discbtn').forEach(x=>{ const on=x.dataset.d===draftDisc; x.classList.toggle('on',on); x.style.borderColor=on?DISC[x.dataset.d].col:''; }); });
  form.querySelectorAll('#fRpe i').forEach(el=>el.onclick=()=>{ draftRpe=+el.dataset.v; form.querySelectorAll('#fRpe i').forEach(x=>x.classList.toggle('on',+x.dataset.v===draftRpe)); });
  form.querySelector('#fSave').onclick=()=>{ const fait=form.querySelector('#fFait').value.trim(), ress=form.querySelector('#fRess').value.trim();
    if(!fait&&!ress) return toast('Écris au moins ce que tu as fait ou ton ressenti.');
    S.journal.push({id:Date.now(),date:form.querySelector('#fDate').value||todayStr(),disc:draftDisc,fait,ressenti:ress,rpe:draftRpe,dur:+form.querySelector('#fDur').value||0});
    save(); toast('Entrée enregistrée ✓'); render(); };
  main.insertAdjacentHTML('beforeend','<div class="cat">Historique</div>');
  if(!S.journal.length){ main.insertAdjacentHTML('beforeend','<div class="empty">Rien pour l\'instant.<br>Ta première note viendra après ta prochaine séance.</div>'); return; }
  [...S.journal].reverse().forEach(e=>{ const v=DISC[e.disc]||DISC.autre;
    const d=document.createElement('div'); d.className='entry';
    d.innerHTML=`<div class="eh"><div class="ico">${v.ico}</div><div class="et"><b>${v.nom}</b><small>${frDate(e.date)}${e.dur?' · '+e.dur+' min':''}${e.rpe?' · RPE '+e.rpe:''}</small></div><span class="del">✕</span></div>
      ${(e.fait||e.ressenti)?`<div class="body">${e.fait?`<span class="lab">Fait</span>${escapeH(e.fait)}`:''}${e.ressenti?`<span class="lab">Ressenti</span>${escapeH(e.ressenti)}`:''}</div>`:''}`;
    d.querySelector('.del').onclick=()=>{ if(confirm('Supprimer cette entrée ?')){ S.journal=S.journal.filter(x=>x.id!==e.id); save(); render(); } };
    main.appendChild(d); });
}

/* ================================================================ PROGRÈS */
function renderProg(){
  main.insertAdjacentHTML('beforeend','<h1 class="page">Progrès</h1>');
  const mobMin=S.mobLog.reduce((a,m)=>a+(m.dur||0),0), wkMin=S.workoutLog.reduce((a,w)=>a+(w.dur||0),0);
  main.insertAdjacentHTML('beforeend',`<div class="statgrid">
    <div class="stat"><b>${dayStreak()}</b><small>jours d'affilée</small></div>
    <div class="stat"><b>${S.mobLog.length}</b><small>séances souplesse/core</small></div>
    <div class="stat"><b>${S.workoutLog.length}</b><small>séances muscu</small></div>
    <div class="stat"><b>${Math.round((mobMin+wkMin)/60*10)/10}h</b><small>temps total guidé</small></div></div>`);

  const fc=document.createElement('div'); fc.className='card'; fc.style.marginTop='12px';
  fc.innerHTML='<b style="font-size:15px">📏 Test du sol</b>';
  if(!S.floorTests.length) fc.insertAdjacentHTML('beforeend','<div class="empty">Fais ton premier test (onglet Aujourd\'hui).</div>');
  else { const cur=curFloor();
    fc.insertAdjacentHTML('beforeend',`<p class="sub" style="margin-top:4px">Niveau actuel : <b style="color:var(--acc)">${FLOOR[cur]}</b>. La courbe doit grimper.</p>`+sparkline(S.floorTests.map(t=>t.level),0,FLOOR.length-1)
      +`<div class="legend" style="justify-content:space-between;margin-top:4px"><span>${FLOOR[0]}</span><span>${FLOOR[FLOOR.length-1]}</span></div>`); }
  main.appendChild(fc);

  const prs=Object.entries(S.prReps);
  if(prs.length){ const prc=document.createElement('div'); prc.className='card'; prc.innerHTML='<b style="font-size:15px">🏆 Records (répétitions)</b>';
    prs.sort((a,b)=>b[1].date.localeCompare(a[1].date)).forEach(([ex,p])=>prc.insertAdjacentHTML('beforeend',`<div class="prrow"><div class="t"><b>${ex}</b><small>${p.date.split('-').reverse().join('/')}</small></div><div class="val">${p.reps} reps</div></div>`));
    main.appendChild(prc); }

  const hm=document.createElement('div'); hm.className='card'; hm.innerHTML='<b style="font-size:15px">Régularité (16 semaines)</b><div class="heatwrap"><div class="heat"></div></div>';
  const heat=hm.querySelector('.heat');
  const mob=new Set(S.mobLog.map(m=>m.date)), wk=new Set(S.workoutLog.map(w=>w.date)), jr=new Set(S.journal.map(j=>j.date));
  const today=new Date(); const dow=(today.getDay()+6)%7; const start=new Date(today); start.setDate(start.getDate()-dow-15*7);
  for(let i=0;i<16*7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const ds=d.toISOString().slice(0,10); const cell=document.createElement('i');
    if(d>today) cell.style.visibility='hidden';
    else { const m=mob.has(ds),w=wk.has(ds),j=jr.has(ds);
      if(w) cell.style.background='var(--muscu)'; else if(m) cell.style.background='var(--acc)'; else if(j) cell.style.background='var(--jour)';
      if(m||w||j) cell.title=ds; } heat.appendChild(cell); }
  hm.insertAdjacentHTML('beforeend',`<div class="legend"><span><i style="background:var(--muscu)"></i>Muscu</span><span><i style="background:var(--acc)"></i>Souplesse/core</span><span><i style="background:var(--jour)"></i>Journal</span></div>`);
  main.appendChild(hm);
}
function sparkline(vals,fmn,fmx){ const w=320,h=110,pad=14;
  const mn=fmn!=null?fmn:Math.min(...vals), mx=fmx!=null?fmx:Math.max(...vals);
  const sx=i=>pad+(vals.length===1?(w/2-pad):i*(w-2*pad)/(vals.length-1));
  const sy=v=>mx===mn?h/2:h-pad-(v-mn)*(h-2*pad)/(mx-mn);
  const pts=vals.map((v,i)=>sx(i)+','+sy(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="var(--acc)"/>`).join('')}</svg>`; }

/* ================================================================ OVERLAY + utils */
const overlay=document.getElementById('overlay'), overlayInner=document.getElementById('overlayInner');
function closeOverlay(){ overlay.classList.remove('open'); }
function openCustom(title,fill){ overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`;
  overlayInner.querySelector('.back').onclick=closeOverlay; overlay.classList.add('open'); overlay.scrollTop=0; fill(overlayInner,closeOverlay); }
function escapeH(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>'); }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

/* ---------------- init ---------------- */
if(S.curWk){ curTab='sess'; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='sess')); }
render();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href='data:application/manifest+json,{"name":"FORGE — calisthénie, boxe & souplesse","short_name":"Forge","display":"standalone","background_color":"#0c0f0e","theme_color":"#0c0f0e","start_url":"."}'>
<title>FORGE — calisthénie, boxe & souplesse</title>
<style>
  :root{
    --bg:#0c0f0e; --bg2:#141a18; --bg3:#1c2422; --line:#2a352f;
    --txt:#e9f2ee; --dim:#8aa39a;
    --acc:#5ad1a5; --accd:#2fae86;
    --muscu:#5b9cff; --boxe:#ff5c6c; --jour:#f5b840; --autre:#8aa39a;
    --ok:#3ecf7a; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 130px}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:2px}
  .logo span{color:var(--acc)}
  .badge{font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#122019,#132a24)}
  .hero .lvl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .hero .lvlname{font-size:22px;font-weight:800;margin:2px 0 6px;color:var(--acc)}
  .hero p{font-size:13px;color:var(--dim);line-height:1.5}

  .btn{display:block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#062018;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;margin-top:0;display:inline-block}
  .btn.danger{background:#3a1a20;color:var(--boxe);border:1px solid #55232c}
  .btn.blue{background:var(--muscu);color:#04122e}
  h1.page{font-size:22px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--dim);font-size:13px;line-height:1.5}
  .cat{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 8px;font-weight:700}

  /* blocs programme */
  .pblock{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
  .pblock .pe{font-size:24px;flex-shrink:0}
  .pblock .pt{flex:1;min-width:0}
  .pblock .pt b{font-size:15px;display:block}
  .pblock .pt small{color:var(--dim);font-size:12px}
  .pblock .pgo{background:var(--bg3);border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
  .pblock .pck{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0}
  .pblock.done{opacity:.6}
  .pblock.done .pck{background:#12261e;color:var(--ok);border-color:#1d4a31}

  /* routines / workouts */
  .rout{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
  .rout .rh{display:flex;align-items:center;gap:12px}
  .rout .ri{font-size:26px}
  .rout .rtx{flex:1;min-width:0}
  .rout .rtx b{font-size:16px;display:block}
  .rout .rtx small{color:var(--dim);font-size:12px}
  .rout .chev{color:var(--dim);padding:6px;font-size:14px}
  .rout .steps{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .rout.open .steps{display:block}
  .rout .steps .st{display:flex;gap:10px;padding:7px 0;font-size:13px;color:#cfe0d9;align-items:baseline}
  .rout .steps .st span{color:var(--dim);font-size:12px;min-width:62px}
  .rout .steps .st em{color:var(--dim);font-style:normal;margin-left:auto;font-size:12px;text-align:right}
  .rout .steps .rnote{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#b9c7d6;line-height:1.55;margin-bottom:10px}
  .rout .steps .st{align-items:flex-start}
  .rout .steps .st .stc{flex:1}
  .rout .steps .st .stc .z{color:var(--dim);font-style:normal;font-size:12px}
  .rout .steps .st .stwhy{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:3px}
  .pwhy{color:#b9c7d6;font-size:12.5px;line-height:1.55;margin-top:14px;max-width:520px;padding:12px 10px 0;border-top:1px solid var(--line)}

  /* test du sol */
  .floor{display:flex;align-items:center;gap:14px}
  .floor .big{font-size:34px}
  .floor .ft{flex:1}.floor .ft b{font-size:16px;display:block}.floor .ft small{color:var(--dim);font-size:12px}
  .levels{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .lvlopt{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;font-weight:600;font-size:15px}
  .lvlopt.on{border-color:var(--acc);background:#12261e}
  .lvlopt .n{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dim);flex-shrink:0}
  .lvlopt.on .n{background:var(--acc);color:#062018;border-color:var(--acc)}

  /* séance muscu */
  .sesshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sesshead b{font-size:18px}
  .sesshead .chrono{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700}
  .warm{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .warm b{font-size:14px}
  .warm ul{list-style:none;margin-top:8px}
  .warm li{font-size:13px;color:#cfe0d9;padding:4px 0 4px 18px;position:relative;line-height:1.4}
  .warm li::before{content:'•';position:absolute;left:4px;color:var(--acc)}
  .exo{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .exo .xh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .exo .xh b{flex:1;font-size:15px}
  .exo .xh .zone{color:var(--muscu);font-size:11px;font-weight:700}
  .exo .presc{font-size:12px;color:var(--acc);font-weight:700;margin:2px 0 6px}
  .exo .tip{font-size:12px;color:var(--dim);margin-bottom:4px;line-height:1.45}
  .exo .progn{font-size:12px;color:#9ec6b6;line-height:1.45;margin-bottom:8px}
  .exo .progn b{color:var(--acc)}
  .exo .last{font-size:12px;color:var(--dim);margin-bottom:8px}
  .exo .last b{color:var(--acc)}
  .setrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .setrow .sn{width:22px;text-align:center;color:var(--dim);font-weight:700;font-size:13px;flex-shrink:0}
  .fld{flex:1;display:flex;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .fld button{width:44px;height:46px;background:none;border:none;color:var(--dim);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0}
  .fld input{flex:1;width:30px;background:none;border:none;color:var(--txt);font-size:17px;font-weight:800;text-align:center;outline:none}
  .fld small{color:var(--dim);font-size:10px;padding-right:10px}
  .setrow .ck{width:48px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0}
  .setrow.done .ck{background:#12261e;color:var(--ok);border-color:#1d4a31}
  .setrow.done .fld{opacity:.5}
  .addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:9px;width:100%;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}

  /* journal */
  .discgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0 4px}
  .discbtn{border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--bg3)}
  .discbtn:active{transform:scale(.96)}
  .discbtn .i{font-size:22px;display:block;margin-bottom:3px}
  .discbtn b{font-size:12px}
  .discbtn.on{border-width:2px}
  textarea,input.txt{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;resize:vertical;margin-top:10px}
  textarea{min-height:64px;line-height:1.5}
  label.fl{font-size:12px;color:var(--dim);font-weight:700;display:block;margin-top:14px}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  input.txt[type=date],input.txt[type=number]{margin-top:6px}
  .rpe{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .rpe i{width:calc((100% - 45px)/10);min-width:26px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .rpe i.on{background:var(--acc);color:#062018;border-color:var(--acc)}
  .entry{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .entry .eh{display:flex;align-items:center;gap:10px}
  .entry .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg3)}
  .entry .et{flex:1;min-width:0}.entry .et b{font-size:15px;display:block}.entry .et small{color:var(--dim);font-size:12px}
  .entry .del{color:var(--dim);padding:4px 8px;cursor:pointer}
  .entry .body{margin-top:10px;font-size:14px;line-height:1.55;color:#cfe0d9}
  .entry .body .lab{color:var(--dim);font-size:12px;font-weight:700;display:block;margin-top:6px}

  /* progress */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--acc)}.stat small{color:var(--dim);font-size:12px}
  .heatwrap{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;margin-top:10px}
  .heat i{width:13px;height:13px;border-radius:3px;background:var(--bg3)}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--dim);font-weight:700;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  .prrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .prrow:last-child{border-bottom:none}
  .prrow .t{flex:1;min-width:0}.prrow b{font-size:14px;display:block}.prrow small{color:var(--dim);font-size:12px}
  .prrow .val{font-weight:800;color:var(--acc);font-size:15px}
  svg.chart{width:100%;height:130px;margin-top:8px}
  .empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px;line-height:1.7}

  /* --- l'heure : créneau du moment & recommandation --- */
  .clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .clock b{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;line-height:1}
  .clock span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .slot{display:inline-flex;align-items:center;gap:6px;background:#0e1a15;border:1px solid var(--line);
    border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--acc);margin-top:10px}
  .nowcard{background:linear-gradient(135deg,#132a22,#16332a);border-color:#2c4a3d}
  .nowlab{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:800}
  .nowname{font-size:21px;font-weight:800;margin:5px 0 3px}
  .nowdet{font-size:13px;color:var(--dim);line-height:1.5}
  .nowwhy{font-size:12.5px;color:#b9c7d6;line-height:1.55;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .tb{display:inline-block;vertical-align:1px;font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;
    margin-left:7px;letter-spacing:.4px;text-transform:uppercase}
  .tb.now{background:#12261e;color:var(--ok);border:1px solid #1d4a31}
  .tb.later{background:var(--bg3);color:var(--dim);border:1px solid var(--line)}
  .tb.off{background:#2b2318;color:var(--jour);border:1px solid #4a3a22}
  .pblock .pt small.when{display:block;color:#7e948c;font-size:11.5px;margin-top:2px}
  .pblock.off{opacity:.7}

  /* --- mise en place détaillée dans le lecteur --- */
  .phelp{background:none;border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:8px 13px;
    font-size:12.5px;font-weight:700;cursor:pointer;margin-top:12px}
  ol.mise{text-align:left;max-width:440px;margin:12px auto 0;padding:12px 14px 12px 30px;background:var(--bg2);
    border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.5;color:#dbe9e2}
  ol.mise li{margin-bottom:7px}
  ol.mise li:last-child{margin-bottom:0}
  ol.mise li::marker{color:var(--acc);font-weight:800}
  .perr{text-align:left;max-width:440px;margin:10px auto 0;padding:11px 13px;background:#2b2318;
    border:1px solid #4a3a22;border-radius:12px;font-size:12.5px;line-height:1.5;color:#e7d7bb}
  .perr b{display:block;color:var(--jour);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,14,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:10.5px;font-weight:700;cursor:pointer}
  nav button .i{display:block;font-size:19px;margin-bottom:2px}
  nav button.on{color:var(--acc)}

  #toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-90px);background:var(--bg3);border:1px solid var(--acc);color:var(--txt);padding:12px 22px;border-radius:14px;font-weight:700;z-index:100;transition:transform .35s;font-size:15px;max-width:92%;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}

  #restbar{position:fixed;bottom:70px;left:0;right:0;z-index:45;display:none}
  #restbar .in{max-width:520px;margin:0 auto;padding:0 12px}
  #restbar .box{background:#12261e;border:1px solid #1d4a31;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
  #restbar b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--ok)}
  #restbar .bar{flex:1;height:6px;background:#0006;border-radius:3px;overflow:hidden}
  #restbar .bar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
  #restbar button{background:none;border:none;color:var(--dim);font-weight:700;cursor:pointer;font-size:13px}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .inner{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .topbar .back{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}
  .topbar b{font-size:16px}

  .player{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 30px;min-height:100vh;display:flex;flex-direction:column}
  .ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .ptop .pquit{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .ptop .pprog{color:var(--dim);font-size:13px;font-weight:700}
  .pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .pbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
  .pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .plabel{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .pstage.hold .plabel{color:var(--acc)}
  .ring{width:172px;height:172px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px 0 4px;transition:background .3s}
  .ringin{width:152px;height:152px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .ptime{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}
  .pname{font-size:22px;font-weight:800}
  .pzone{font-size:13px;color:var(--acc);font-weight:700}
  .pcue{font-size:15px;color:#cfe0d9;line-height:1.55;max-width:420px;margin-top:6px}
  /* illustrations de posture (SVG inline) */
  .posewrap{width:100%;display:flex;justify-content:center;margin:4px 0 2px}
  .posefig{width:min(82%,290px);height:auto;max-height:158px;display:block}
  .posefig .b{fill:none;stroke:#dbe9e2;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .posefig .h{fill:#dbe9e2}
  .posefig .m{fill:none;stroke:var(--acc);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round}
  .posefig .fl,.posefig .w{stroke:#4b5b54;stroke-width:3;stroke-linecap:round}
  .posefig .ar{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round}
  .posefig .ard{fill:var(--acc)}
  .posefig .g{fill:none;stroke:#8aa79b;stroke-width:2;stroke-dasharray:3 4}
  .stfig{flex:0 0 auto;width:50px;height:38px;margin-right:2px}.stfig .posefig{width:50px;max-height:38px}
  .pctrl{display:flex;gap:10px;margin-top:18px}
  .pctrl .pbtn{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:15px 8px;font-size:14px;font-weight:700;cursor:pointer}
  .pctrl .pbtn.main{flex:1.4;background:var(--acc);color:#062018}
  .pctrl .pbtn:active{transform:scale(.97)}
  /* ---- boxe ---- */
  .bxsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bxopt{border:1px solid var(--line);background:var(--bg3);border-radius:13px;padding:13px 10px;text-align:center;cursor:pointer}
  .bxopt .i{font-size:24px;display:block;margin-bottom:5px}
  .bxopt b{display:block;font-size:14px}
  .bxopt small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.35}
  .bxopt.on{border-color:var(--boxe);background:#2a1418}
  .bxopt.on b{color:var(--boxe)}
  .bxfmt{display:flex;gap:8px;margin-top:10px}
  .bxfmt button{flex:1;background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:10px 4px;font-size:12.5px;font-weight:700;cursor:pointer}
  .bxfmt button.on{border-color:var(--boxe);background:#2a1418;color:var(--boxe)}
  .bxvol{display:flex;align-items:center;gap:14px}
  .bxvol b{font-size:26px;font-weight:900;line-height:1}
  .bxvol small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .bxvol .vbar{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}

    {emoji:'🌾',nom:"Jefferson curl (très léger)",zone:"Force en amplitude",sec:40,cue:"Debout sur une marche, déroule la colonne vertèbre par vertèbre vers le bas (lest léger ou rien), puis remonte pareil. Lent, contrôlé.",why:"Renforcer le dos DANS son amplitude maximale rend la souplesse « utile » et durable, et protège des blessures. À chaud uniquement."},

/* ---- état calisthénie ---- */
function cali(){
  if(!S.cali) S.cali={};
  const C=S.cali;
  if(!C.lv) C.lv={};
  Object.keys(TRACKS).forEach(k=>{ if(C.lv[k]==null) C.lv[k]=0; });
  if(C.placed==null) C.placed=false;
  if(C.barre==null) C.barre=false;
  if(!C.days) C.days={};
  if(C.offN==null) C.offN=0;
  if(!C.hist) C.hist=[];
  return C;
}
function trackList(){ return ['hs','planche','pompes','hspu','dips','tirage'].concat(cali().barre?['tractions']:[],['jambes','core']); }
function lvOf(tk){ const n=TRACKS[tk].lv.length; return Math.max(0,Math.min(n-1,cali().lv[tk]||0)); }
function setLv(tk,i,why){ const C=cali(), n=TRACKS[tk].lv.length; i=Math.max(0,Math.min(n-1,i)); const from=lvOf(tk);
  if(i===from) return; C.lv[tk]=i; C.hist.push({date:todayStr(),tk,from,to:i,why:why||''}); save(); }
function presc(e){ return `${e.n} × ${e.min}–${e.max} ${e.u==='s'?'s':'reps'}${e.ps?' / côté':''}`; }
function fmtRest(s){ return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+' s'; }
function trackOfBloc(b){ if(b.t==='pullB') return cali().barre?'tractions':'tirage'; return b.t; }
function caliEntry(b){
  if(b.acc){ const a=ACC[b.acc];
    return {ex:a.nom, zone:a.zone, fig:a.fig, u:'reps', n:a.sets, min:a.min, max:a.max, rest:a.rest, cue:a.cue, why:a.why, prog:a.prog, ps:!!a.ps, opt:!!b.opt, acc:b.acc}; }
  const tk=trackOfBloc(b), T=TRACKS[tk], i=lvOf(tk), L=T.lv[i];
  return {ex:L.nom, zone:T.zone, fig:L.fig, u:L.u||'reps', track:tk, lvl:i, nlv:T.lv.length,
    n:b.light?3:L.sets, min:L.min, max:L.max, rest:b.light?90:L.rest, cue:L.cue, why:T.why, ps:!!L.ps,
    light:!!b.light, opt:!!b.opt, next:T.lv[i+1]?T.lv[i+1].nom:null};
}

/* ---- le rythme : un jour sur deux ----
   La dernière séance de calisthénie décide de tout : faite hier → aujourd'hui on
   récupère ; faite il y a 2 jours ou plus → séance aujourd'hui, l'autre lettre.
   Une séance ratée glisse au lendemain au lieu de disparaître. */
function caliLast(){ for(let i=S.workoutLog.length-1;i>=0;i--){ if(S.workoutLog[i].cali) return S.workoutLog[i]; } return null; }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5); }
function shiftDay(ds,n){ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function caliDoneToday(){ const L=caliLast(); return !!(L&&L.date===todayStr()); }
function nextType(){ const L=caliLast(); return L?(L.cali==='A'?'B':'A'):'A'; }
function dayInfo(){
  const C=cali(), t=todayStr();
  Object.keys(C.days).forEach(d=>{ if(daysBetween(d,t)>40) delete C.days[d]; });
  if(C.days[t]) return C.days[t];
  const L=caliLast(); let info;
  if(!L||daysBetween(L.date,t)>=2) info={k:'cali',t:nextType()};
  else if(L.date===t) info={k:'cali',t:L.cali};
  else { info={k:'off',o:C.offN%4}; C.offN++; }
  C.days[t]=info; save(); return info;
}

/* les 7 prochains jours, en supposant que le programme est suivi */
function predictDays(n){
  const C=cali(), t=todayStr(), out=[], ti=dayInfo();
  const L=caliLast(); let lastDate=L?L.date:null, lastT=L?L.cali:null, offN=C.offN;
  out.push({ds:t,info:ti});
  if(ti.k==='cali'){ lastDate=t; lastT=ti.t; }
  for(let k=1;k<n;k++){ const ds=shiftDay(t,k);
    if(!lastDate||daysBetween(lastDate,ds)>=2){ const T=lastT==='A'?'B':'A'; out.push({ds,info:{k:'cali',t:T}}); lastDate=ds; lastT=T; }
    else { out.push({ds,info:{k:'off',o:offN%4}}); offN++; } }
  return out;
}

/* ---------------- l'heure : créneaux & séance adéquate ----------------
   L'app lit l'horloge et propose ce qui a du sens MAINTENANT : à froid on
   lubrifie, en fin de journée on charge, le soir on redescend. */
const CRENEAUX=[
  {id:'nuit',   emoji:'🌙', nom:'Nuit',         h:[0,300],     mot:"Le corps répare. À cette heure, rien ne se gagne — sauf le sommeil."},
  {id:'reveil', emoji:'🌅', nom:'Réveil',       h:[300,540],   mot:"Corps froid et raide : on lubrifie les articulations, on ne force sur rien."},
  {id:'matin',  emoji:'☀️', nom:'Matinée',      h:[540,720],   mot:"La machine est lancée : tu peux charger, avec un échauffement complet."},
  {id:'aprem',  emoji:'🕑', nom:'Après-midi',   h:[720,960],   mot:"Bon créneau — laisse juste passer la digestion après un vrai repas."},
  {id:'pic',    emoji:'🔥', nom:'Pic de forme', h:[960,1230],  mot:"Ta meilleure fenêtre : force et souplesse au maximum de la journée."},
  {id:'soir',   emoji:'🌆', nom:'Soirée',       h:[1230,1440], mot:"On redescend : souplesse profonde et respiration, pas d'intensité."},
];
const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const hhmm=()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const hLabel=m=>m>=1440?'minuit':Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'');
function creneauNow(){ const n=nowMin(); return CRENEAUX.find(c=>n>=c.h[0]&&n<c.h[1])||CRENEAUX[0]; }
function fenetre(ids){ if(!ids||!ids.length) return '';
  const cs=CRENEAUX.filter(c=>ids.indexOf(c.id)>=0); if(!cs.length) return '';
  return hLabel(Math.min.apply(null,cs.map(c=>c.h[0])))+'→'+hLabel(Math.max.apply(null,cs.map(c=>c.h[1]))); }

/* top = le bon moment · ok = ça passe · le reste = hors créneau (jamais interdit) */
const TIMING={
  'soup:reveil':  {top:['reveil'],                    ok:['matin'],                  why:"Elle est faite pour le corps au sortir du lit : amplitude progressive, aucune force, et des disques vertébraux encore gorgés d'eau qu'on ménage. Passé la matinée, elle n'a plus grand-chose à réveiller."},
  'soup:mobilite':{top:['matin','aprem'],             ok:['reveil','pic','soir'],    why:"Entretien articulaire à faible amplitude : ça passe à presque n'importe quelle heure, un peu mieux une fois le corps réveillé."},
  'soup:complete':{top:['pic','soir'],                ok:['aprem'],                  why:"Le gain de souplesse se fait à chaud : en fin de journée, le muscle est plus étirable et le système nerveux plus tolérant."},
  'soup:plancher':{top:['pic','soir'],                ok:['aprem'],                  why:"À faire à chaud — après le sport ou une douche chaude. Le matin, les disques vertébraux sont gorgés d'eau : on évite la flexion avant poussée."},
  'soup:express': {top:['matin','aprem','pic','soir'],ok:['reveil'],                 why:"Le minimum quotidien : n'importe quand vaut infiniment mieux que jamais."},
  'soup:haut':    {top:['aprem','pic','soir'],         ok:['matin'],                  why:"À faire juste après la calisthénie, muscles chauds : c'est là que l'étirement porte le plus et ne coûte rien à la force."},
  'soup:soir':    {top:['soir'],                      ok:['pic'],                    why:"Tenues longues et expiration allongée : ça gagne de l'amplitude ET ça prépare l'endormissement."},
  'work':         {top:['pic'],                       ok:['matin','aprem'],          why:"Force et puissance culminent en fin d'après-midi, quand la température corporelle est au plus haut. Plus tôt, c'est possible — mais l'échauffement doit être deux fois plus long."},
  'cali':         {top:['pic'],                       ok:['matin','aprem'],          why:"Force et équilibre culminent en fin d'après-midi, quand la température corporelle est au plus haut. Plus tôt, c'est possible — mais l'échauffement doit être deux fois plus long."},
  'run':          {top:['pic'],                       ok:['reveil','matin','aprem'], why:"Le cardio supporte l'heure matinale bien mieux que la fonte : allure et confort restent meilleurs en fin de journée, mais courir tôt reste une vraie option."},
  'circuit:core': {top:['matin','aprem','pic'],       ok:['reveil','soir'],          why:"Gainage : peu d'amplitude, peu de risque à froid. Cale-le où tu veux dans la journée."},
  'boxe':         {top:['pic'],                      ok:['matin','aprem'],          why:"La boxe demande les deux choses qui culminent en fin d'après-midi : un système nerveux frais pour la coordination fine, et une température corporelle haute pour la puissance. Le matin ta vitesse de réaction est mesurablement plus basse et tes épaules sont froides — si tu y vas quand même, double l'échauffement et laisse tomber les rounds de puissance."},
  'piano':        {top:['matin','aprem','pic','soir'],ok:['reveil'],                 why:"Pas un entraînement physique : le seul créneau à éviter, c'est celui où tu réveilles la maison."},
};
function timingFor(it){ const a=it.act||''; return TIMING[a]||TIMING[a.split(':')[0]]||{top:[],ok:[],why:''}; }
function statut(it,cr){ const t=timingFor(it);
  if(t.top.indexOf(cr.id)>=0) return 'top'; if(t.ok.indexOf(cr.id)>=0) return 'ok'; return 'off'; }
/* la meilleure chose à faire maintenant parmi ce qui reste à faire aujourd'hui */
function suggestNow(day,cr){ const todo=day.items.filter(it=>!planDone(it.id)); if(!todo.length) return null;
  let best=null; todo.forEach(it=>{ const st=statut(it,cr), r=(st==='top'?2:st==='ok'?1:0);
    if(!best||r>best.rank) best={it:it,rank:r}; }); return best; }

/* ---------------- audio ---------------- */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} return AC; }
function beep(f=880,dur=.12,vol=.4,when=0){ const ctx=ac(); if(!ctx)return;
  const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.02); }
function bell(){ beep(587,.4,.5); beep(784,.5,.4,.06); if(navigator.vibrate)navigator.vibrate([100,50,100]); }
function tick(){ beep(1150,.05,.22); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }

      if(this.left<=0){ this.stop(); bell(); toast('💪 Repos terminé — série suivante.'); }
      else { if(this.left<=3) tick(); this.draw(); } },1000); },
  draw(){ document.getElementById('restT').textContent=Math.floor(this.left/60)+':'+String(this.left%60).padStart(2,'0');
    document.getElementById('restI').style.width=(this.left/this.total*100)+'%'; },
  stop(){ if(this.timer){clearInterval(this.timer);this.timer=null;} document.getElementById('restbar').style.display='none'; }
};

/* ---- séance ---- */
function lastWk(ex){ for(let i=S.workoutLog.length-1;i>=0;i--){
  const e=(S.workoutLog[i].entries||[]).find(x=>x.ex===ex); if(e&&e.sets.length) return {date:S.workoutLog[i].date, sets:e.sets}; } return null; }
function startCali(T, planId=null){
  if(S.curWk){ goSess(); return; }
  if(!cali().placed){ openPlacement(()=>startCali(T,planId)); return; }
  ac(); const s=CALI_SESS[T];
  S.curWk={ id:'cali'+T, cali:T, nom:s.nom, planId, warm:CALI_WARM, start:Date.now(),
    entries:s.blocs.map(caliEntry).map(e=>{
      if(e.light) e.ex=e.ex+' (rappel)';
      const lp=lastWk(e.ex); const base=lp?lp.sets[0].reps:e.min;
      return {...e, sets:[...Array(e.n)].map(()=>({reps:base,done:false}))}; }) };
  save(); goSess();
}
let wkChrono=null;
function renderWkSession(){
  clearInterval(wkChrono); const c=S.curWk;
  main.insertAdjacentHTML('beforeend',`<div class="sesshead"><b>${c.nom}</b><span class="chrono" id="chrono"></span></div>
    <p class="sub" style="margin-bottom:12px">${c.cali?'Valide chaque série (✓) : le repos démarre tout seul. Pour une tenue, ⏱ lance un chrono : 10 s pour te mettre en place, puis il compte jusqu\'à ce que tu lâches.':'Valide chaque série (✓) : elle se verrouille et le repos démarre tout seul.'}</p>`);
  if(c.warm&&c.warm.length) main.insertAdjacentHTML('beforeend',`<div class="warm"><b>🔥 Échauffement ${c.cali?'poignets & épaules (6–8 min)':'(2–3 min)'}</b><ul>${c.warm.map(x=>`<li>${x}</li>`).join('')}</ul></div>`);
  main.insertAdjacentHTML('beforeend','<div id="body"></div>');
  const ch=main.querySelector('#chrono'); const t=()=>{ ch.textContent=Math.floor((Date.now()-c.start)/60000)+' min'; }; t(); wkChrono=setInterval(t,15000);
  const body=main.querySelector('#body');
  c.entries.forEach(en=>{
    const lp=lastWk(en.ex), u=en.u==='s'?'s':'reps';
    const d=document.createElement('div'); d.className='exo';
    if(en.min!=null){
      const ds=en.sets.filter(s=>s.done);
      const reached=!en.light&&en.track&&ds.length>=en.n&&ds.every(s=>s.reps>=en.max);
      const progTxt=en.light?"arrête chaque tenue 2–3 s avant ton max. Technique parfaite, zéro fatigue : on entretient la planche entre deux séances A."
        :en.track?(en.next?`${en.n} × ${en.max} ${u} propres → <b>${en.next}</b>`:'dernier niveau : allonge les tenues et soigne la ligne.'):en.prog;
      d.innerHTML=`<div class="xh"><b>${en.ex}${en.track&&!en.light?`<span class="lvb">niv. ${en.lvl+1}/${en.nlv}</span>`:''}${en.light?'<span class="optb">léger</span>':''}${en.opt?'<span class="optb">si tu as le temps</span>':''}</b><span class="zone">${en.zone}</span></div>
        ${en.fig?`<div class="xfig">${poseSVG(en.fig)}</div>`:''}
        <div class="presc">${presc(en)} · repos ${fmtRest(en.rest)}</div>
        <div class="tip">${en.cue}</div>
        ${en.why&&!en.light?`<div class="whyx">🔬 ${en.why}</div>`:''}
        <div class="progn">↗ <b>${en.light?'Léger :':'Pour monter :'}</b> ${progTxt}</div>
        ${reached?(en.next?'<div class="ok">🎯 Objectif du niveau atteint — je te proposerai de monter à la fin.</div>':'<div class="ok">🎯 Objectif atteint au dernier niveau. Bravo.</div>'):''}
        <div class="last">${lp?`Dernière fois : <b>${lp.sets.map(s=>s.reps).join(' · ')} ${u}</b> — fais au moins autant.`:'Premier passage : pose ta référence.'}</div>
        <div class="sets"></div><button class="addset">+ série</button>`;
    } else {
      d.innerHTML=`<div class="xh"><b>${en.ex}</b><span class="zone">${en.zone}</span></div>
        <div class="presc">${en.sets.length} × ${en.rep} · tempo ${en.tempo} · repos ${en.rest}s · RPE ${en.rpe}</div>
        <div class="tip">${en.tip}</div>
        <div class="progn">↗ <b>Progresser :</b> ${en.prog}</div>
        <div class="last">${lp?`Dernière fois : <b>${lp.sets.map(s=>s.reps).join(' · ')} reps</b> — bats ça.`:'Premier passage : pose ta référence.'}</div>
        <div class="sets"></div><button class="addset">+ série</button>`;
    }
    const sd=d.querySelector('.sets');
    en.sets.forEach((st,si)=>sd.appendChild(wkSetRow(en,st,si)));
    d.querySelector('.addset').onclick=()=>{ const p=en.sets[en.sets.length-1]; en.sets.push({reps:p?p.reps:(en.min||10),done:false}); save(); keepScroll(); };
    body.appendChild(d);
  });
  main.insertAdjacentHTML('beforeend',`<button class="btn" id="fin">✓ Terminer la séance</button><button class="btn danger" id="ann">Annuler</button>`);
  main.querySelector('#fin').onclick=finishWorkout;
  main.querySelector('#ann').onclick=()=>{ if(confirm('Annuler ? Rien ne sera enregistré.')){ S.curWk=null; save(); Rest.stop(); render(); } };
}
function keepScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function wkSetRow(en,st,si){
  const r=document.createElement('div'); r.className='setrow'+(st.done?' done':'');
  const isHold=en.u==='s';
  r.innerHTML=`<span class="sn">${si+1}</span>
    <div class="fld"><button data-a="-">−</button><input type="number" inputmode="numeric" value="${st.reps}"><small>${isHold?'s':'reps'}</small><button data-a="+">+</button></div>
    ${isHold?'<button class="hold" aria-label="Chrono de tenue">⏱</button>':''}
    <button class="ck">${st.done?'✓':'○'}</button>`;
  const inp=r.querySelector('input');
  inp.onchange=()=>{ st.reps=Math.max(0,+inp.value||0); save(); };
  r.querySelectorAll('.fld button').forEach(b=>b.onclick=()=>{ st.reps=Math.max(0,st.reps+(b.dataset.a==='+'?1:-1)); inp.value=st.reps; save(); });
  const hb=r.querySelector('.hold'); if(hb) hb.onclick=()=>holdTimer(en,st,si);
  r.querySelector('.ck').onclick=()=>{ st.done=!st.done; save();
    if(st.done){ if(navigator.vibrate)navigator.vibrate(40); Rest.start(en.rest||S.restDur); }
    if(en.min!=null) keepScroll();
    else { r.classList.toggle('done',st.done); r.querySelector('.ck').textContent=st.done?'✓':'○'; } };
  return r;
}

/* ---- chrono de tenue : 10 s de mise en place, puis il compte jusqu'à ce que tu lâches ---- */
function holdTimer(en,st,si){
  ac(); Rest.stop(); let phase='prep', left=10, sec=0, timer=null, wl=null;
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  player.classList.add('open'); player.scrollTop=0;
  function paint(){ const go=phase==='go';
    const deg=go?Math.min(360,sec/en.max*360):(1-left/10)*360;
    const lab=go?(sec>=en.max?'Objectif atteint 🎯 — lâche quand tu veux':sec>=en.min?'Minimum atteint — continue':'Tiens'):'Mets-toi en place';
    player.innerHTML=`<div class="player">
      <div class="ptop"><button class="pquit">✕ Annuler</button><span class="pprog">⏱ série ${si+1}/${en.sets.length}</span></div>
      <div class="pstage ${go?'hold':'prep'}"><div class="plabel">${lab}</div>
        ${en.fig?`<div class="posewrap">${poseSVG(en.fig)}</div>`:''}
        <div class="ring" style="background:conic-gradient(${go?(sec>=en.max?'var(--ok)':'var(--acc)'):'var(--dim)'} ${deg}deg, var(--bg3) 0)"><div class="ringin"><div class="ptime">${go?sec:left}</div></div></div>
        <div class="pname">${en.ex}</div><div class="pzone">Cible ${en.min}–${en.max} s${en.ps?' par côté':''}</div>
        <div class="pcue">${en.cue}</div></div>
      <div class="pctrl">${go?'<button class="pbtn main" data-a="stop" style="flex:1">■ J\'ai lâché — enregistrer</button>':'<button class="pbtn main" data-a="go" style="flex:1">▶ Je suis en place</button>'}</div></div>`;
    player.querySelector('.pquit').onclick=()=>{ stopAll(); player.classList.remove('open'); };
    const g=player.querySelector('[data-a="go"]'); if(g) g.onclick=startGo;
    const s=player.querySelector('[data-a="stop"]'); if(s) s.onclick=finish; }
  function startGo(){ phase='go'; sec=0; beep(660,.25,.45); if(navigator.vibrate)navigator.vibrate(40); paint(); }
  function step(){
    if(phase==='prep'){ left--; if(left<=0) startGo(); else { if(left<=3) tick(); paint(); } return; }
    sec++; if(sec===en.min) beep(880,.15,.4); else if(sec===en.max) bell(); else if(sec%5===0) tick(); paint(); }
  function stopAll(){ clearInterval(timer); try{wl?.release();}catch(e){} wl=null; }
  function finish(){ stopAll(); player.classList.remove('open'); st.reps=sec; st.done=true; save();
    if(navigator.vibrate)navigator.vibrate(40); keepScroll(); Rest.start(en.rest||S.restDur);
    toast('⏱ '+sec+' s notées — ajuste avec − si tu as lâché avant'); }
  paint(); timer=setInterval(step,1000);
}

function finishWorkout(){
  const c=S.curWk;
  const entries=c.entries.map(en=>{ const o={ex:en.ex,zone:en.zone,sets:en.sets.filter(s=>s.done).map(s=>({reps:s.reps}))};
    if(en.u) o.u=en.u; if(en.track){ o.track=en.track; o.lvl=en.lvl; } if(en.light) o.light=true; return o; }).filter(en=>en.sets.length);
  if(!entries.length) return toast('Valide au moins une série (✓) avant de terminer.');
  const dur=Math.max(1,Math.round((Date.now()-c.start)/60000)); const newPR=[];
  /* niveaux : toutes les séries prescrites au plafond → on propose de monter ;
     toutes sous le plancher → on propose de redescendre. Jamais d'office. */
  const ups=[], downs=[];
  if(c.cali) c.entries.forEach(en=>{ if(!en.track||en.light||lvOf(en.track)!==en.lvl) return;
    const d=en.sets.filter(s=>s.done);
    if(d.length>=en.n&&d.every(s=>s.reps>=en.max)&&en.lvl<en.nlv-1) ups.push(en);
    else if(d.length>=2&&d.every(s=>s.reps<en.min)&&en.lvl>0) downs.push(en); });
  entries.forEach(en=>{ if(en.light) return; const best=Math.max(...en.sets.map(s=>s.reps)); const old=S.prReps[en.ex];
    if(best>0 && (!old||best>old.reps)){ S.prReps[en.ex]={reps:best,date:todayStr(),u:en.u||'reps'}; newPR.push(en.ex); } });
  const log={id:Date.now(),date:todayStr(),nom:c.nom,dur,entries}; if(c.cali) log.cali=c.cali;
  S.workoutLog.push(log);
  if(c.planId) markPlan(c.planId); if(c.cali) markPlan('cali');
  const repE=entries.filter(e=>e.u!=='s'), secE=entries.filter(e=>e.u==='s');
  const totReps=repE.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.reps,0),0), totSec=secE.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.reps,0),0);
  const totSets=entries.reduce((a,e)=>a+e.sets.length,0);
  S.curWk=null; save(); Rest.stop(); clearInterval(wkChrono); updateHeader();
  openCustom('Séance terminée',(inner,close)=>{
    const unitOf=ex=>(S.prReps[ex].u==='s'?' s':'');
    inner.insertAdjacentHTML('beforeend',`<div style="text-align:center;padding:8px 0">
      <div style="font-size:54px">${c.cali?CALI_SESS[c.cali].emoji:'💪'}</div><div style="font-size:22px;font-weight:800;margin:6px 0">${c.nom}</div>
      <p class="sub">${dur} min · ${totSets} séries${totReps?' · '+totReps+' répétitions':''}${totSec?' · '+(totSec>=60?Math.floor(totSec/60)+' min '+(totSec%60)+' s':totSec+' s')+' de tenues':''}</p>
      ${newPR.length?`<div style="margin-top:14px;background:var(--bg2);border:1px solid var(--acc);border-radius:12px;padding:12px;text-align:left">🏆 <b>Record${newPR.length>1?'s':''} :</b> ${newPR.map(e=>e+' ('+S.prReps[e].reps+unitOf(e)+')').join(' · ')}</div>`:''}
      </div>`);
    ups.forEach(en=>{ const Tk=TRACKS[en.track], nx=Tk.lv[en.lvl+1];
      const box=document.createElement('div'); box.className='lvup';
      box.innerHTML=`<b>🎉 ${Tk.emoji} ${Tk.nom} : niveau suivant débloqué</b><small>Toutes tes séries de « ${en.ex} » ont atteint ${en.max} ${en.u==='s'?'s':'reps'}. Prochain niveau : <b style="color:var(--txt);display:inline">${nx.nom}</b> (${nx.sets} × ${nx.min}–${nx.max} ${nx.u==='s'?'s':'reps'}).</small>
        <div class="row2"><button class="btn cali" data-a="up">Monter ↗</button><button class="btn ghost" data-a="no">Pas encore</button></div>`;
      box.querySelector('[data-a="up"]').onclick=()=>{ setLv(en.track,en.lvl+1,'objectif atteint'); box.innerHTML=`<b>✓ ${Tk.nom} : niveau ${en.lvl+2} — ${nx.nom}</b><small>À la prochaine séance.</small>`; };
      box.querySelector('[data-a="no"]').onclick=()=>{ box.innerHTML=`<b>${Tk.nom} : on consolide</b><small>Je te le reproposerai la prochaine fois que tu atteins l'objectif.</small>`; };
      inner.appendChild(box); });
    downs.forEach(en=>{ const Tk=TRACKS[en.track], pv=Tk.lv[en.lvl-1];
      const box=document.createElement('div'); box.className='lvup down';
      box.innerHTML=`<b>${Tk.emoji} ${Tk.nom} : niveau peut-être trop dur</b><small>Aucune série n'a atteint le minimum (${en.min} ${en.u==='s'?'s':'reps'}). Un jour sans arrive à tout le monde ; si ça se répète, redescends à « ${pv.nom} » pour bâtir la base.</small>
        <div class="row2"><button class="btn ghost" data-a="down">Redescendre</button><button class="btn ghost" data-a="keep">Garder</button></div>`;
      box.querySelector('[data-a="down"]').onclick=()=>{ setLv(en.track,en.lvl-1,'trop dur'); box.innerHTML=`<b>✓ ${Tk.nom} : retour à « ${pv.nom} »</b><small>On remonte dès que c'est solide.</small>`; };
      box.querySelector('[data-a="keep"]').onclick=()=>{ box.innerHTML=`<b>${Tk.nom} : on garde</b><small>On réessaie à la prochaine séance.</small>`; };
      inner.appendChild(box); });
    inner.insertAdjacentHTML('beforeend',`<p class="sub" style="text-align:center;margin-top:14px">${c.cali?'Prochaine séance : après-demain, séance '+(c.cali==='A'?'B — HSPU':'A — Planche')+'. ':''}${dayStreak()} jour(s) d'affilée 🔥</p>`);
    const ok=document.createElement('button'); ok.className='btn'; ok.textContent='OK'; ok.onclick=()=>{ close(); render(); }; inner.appendChild(ok);
  });
  bell();
}

function openFloorTest(){ openCustom('Test du sol',(inner,close)=>{

    player.querySelector('[data-a="stop"]').onclick=stop; }
  function stop(){ clearInterval(timer); const min=Math.max(1,Math.round(sec/60));

/* ---------------- lecteur guidé (souplesse + gainage) ---------------- */
function startRoutine(routine, planId=null){
  ac(); const phases=[];
  const prep = routine.prep || 8;              // temps de mise en place avant chaque exercice
  const sideSwitch = Math.min(prep, 8);        // transition pour changer de côté
  const setRest = routine.setRest || Math.min(prep, 15); // repos court entre deux séries du même étirement
  routine.steps.forEach(s=>{ const sets = s.sets>1 ? s.sets : 1;
    phases.push({kind:'prep',sec:prep,s});
    const holds = side => { for(let k=1;k<=sets;k++){ phases.push({kind:'hold',sec:s.sec,s,side,setNo:k,setTot:sets});
      if(k<sets) phases.push({kind:'rest',sec:setRest,s}); } };
    if(s.sides){ holds('gauche'); phases.push({kind:'switch',sec:sideSwitch,s}); holds('droite'); }
    else holds(null); });
  const holdTotal=phases.filter(p=>p.kind==='hold').length;
  let idx=0,left=phases[0].sec,paused=false,timer=null,started=Date.now(),wl=null;
  let showMise=true;   // mode d'emploi déplié pendant qu'on se met en place
  const openMise=i=>{ const k=phases[i].kind; showMise=(k==='prep'||k==='switch'); };
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  player.classList.add('open'); player.scrollTop=0;
  const holdNo=i=>{ let n=0; for(let k=0;k<=i;k++) if(phases[k].kind==='hold') n++; return n; };
  function paint(){ const p=phases[idx], isTrans=(p.kind==='prep'||p.kind==='switch'||p.kind==='rest'); const deg=Math.max(0,Math.min(360,(1-left/p.sec)*360));
    const doneHolds=isTrans?holdNo(idx):holdNo(idx)-1; const displayNo=Math.min(holdTotal,isTrans?holdNo(idx)+1:holdNo(idx));
    const nextSide=isTrans && phases[idx+1] ? phases[idx+1].side : null;
    let label;
    if(p.kind==='prep') label='Prépare-toi'+(nextSide?' · côté '+nextSide:'');
    else if(p.kind==='switch') label='Change de côté'+(nextSide?' · '+nextSide:'');
    else if(p.kind==='rest') label='Repos · relâche et respire';
    else label=(p.s.dyn?'En mouvement':'Maintiens')+(p.side?' · côté '+p.side:'')+(p.setTot>1?' · série '+p.setNo+'/'+p.setTot:'');
    player.innerHTML=`<div class="player">
      <div class="ptop"><button class="pquit">✕ Quitter</button><span class="pprog">${routine.emoji} ${displayNo}/${holdTotal}</span></div>
      <div class="pbar"><i style="width:${doneHolds/holdTotal*100}%"></i></div>
      <div class="pstage ${isTrans?'prep':'hold'}">
        <div class="plabel">${label}</div>
        ${(()=>{const fig=poseSVG(p.s);return fig?`<div class="posewrap">${fig}</div>`:'';})()}
        <div class="ring" style="background:conic-gradient(${isTrans?'var(--dim)':'var(--acc)'} ${deg}deg, var(--bg3) 0)"><div class="ringin"><div class="ptime">${left}</div></div></div>
        <div class="pname">${p.s.emoji} ${p.s.nom}</div><div class="pzone">${p.s.zone}</div><div class="pcue">${p.s.cue}</div>
        ${(()=>{ const ex=explicFor(p.s); if(!ex) return ''; let h='';
           if(ex.mise&&ex.mise.length){
             h+=`<button class="phelp" data-a="help">${showMise?'▴ Masquer la mise en place':'❔ Comment on se met en place ?'}</button>`;
             if(showMise) h+=`<ol class="mise">${ex.mise.map(x=>`<li>${x}</li>`).join('')}</ol>`;
           }
           if(ex.err) h+=`<div class="perr"><b>L'erreur à éviter</b>${ex.err}</div>`;
           return h; })()}${p.s.why?`<div class="pwhy">🔬 ${p.s.why}</div>`:''}</div>
      <div class="pctrl"><button class="pbtn" data-a="prev">‹ Préc.</button>
        <button class="pbtn main" data-a="pause">${paused?'▶ Reprendre':'❚❚ Pause'}</button>
        <button class="pbtn" data-a="next">Passer ›</button></div></div>`;
    player.querySelector('.pquit').onclick=quit;
    player.querySelector('[data-a="prev"]').onclick=()=>goto(idx-1);
    player.querySelector('[data-a="next"]').onclick=()=>goto(idx+1);
    player.querySelector('[data-a="pause"]').onclick=()=>{ paused=!paused; paint(); };
    const hb=player.querySelector('[data-a="help"]'); if(hb) hb.onclick=()=>{ showMise=!showMise; paint(); }; }
  function goto(i){ if(i<0)i=0; if(i>=phases.length){ finish(); return; } idx=i; left=phases[idx].sec; openMise(idx); cue(phases[idx]); paint(); }
  function cue(p){ if(p.kind==='hold') beep(660,.25,.4); else beep(440,.15,.3); if(navigator.vibrate)navigator.vibrate(30); }
  function step(){ if(paused)return; left--;
    if(left<=0){ if(idx>=phases.length-1){ finish(); return; } idx++; left=phases[idx].sec; openMise(idx); cue(phases[idx]); }
    else if(left<=3){ tick(); } paint(); }
  function stopAll(){ clearInterval(timer); try{wl?.release();}catch(e){} wl=null; }
  function quit(){ if(confirm('Quitter la séance ? Elle ne sera pas enregistrée.')){ stopAll(); player.classList.remove('open'); } }
  function finish(){ stopAll(); bell(); setTimeout(bell,350); const dur=Math.max(1,Math.round((Date.now()-started)/60000));
    S.mobLog.push({id:Date.now(),date:todayStr(),routine:routine.nom,dur}); if(planId) markPlan(planId); save(); updateHeader();
    player.innerHTML=`<div class="player"><div class="pdone"><div class="big">${routine.emoji}</div>
      <div style="font-size:24px;font-weight:800;margin:8px 0">Séance terminée</div>
      <p class="sub">${routine.nom} · ${dur} min · ${dayStreak()} jour(s) d'affilée 🔥</p>
      <p class="sub" style="margin-top:14px">La régularité fait tout. Reviens demain.</p>
      <button class="btn" id="pclose" style="margin-top:20px">Terminer</button></div></div>`;
    player.querySelector('#pclose').onclick=()=>{ player.classList.remove('open'); render(); }; }
  cue(phases[0]); paint(); timer=setInterval(step,1000);
}

/* ---------------- réglages, calculs ---------------- */
function bx(){ if(!S.bx) S.bx={}; if(S.bx.sac===undefined) S.bx.sac=null; if(!S.bx.fmt) S.bx.fmt='pro'; return S.bx; }
function bxFmt(){ return BXFMT[bx().fmt]||BXFMT.pro; }
/* un round résolu : durée et repos définitifs selon le format choisi */
function bxRound(key){ const r=(typeof key==='string')?BR[key]:key; if(!r) return null;
  const f=bxFmt(), sec=r.full? f.sec : r.sec;
  /* les relances sont écrites pour un round de 3 min : on les remet à l'échelle du format choisi,
     sauf pour les rounds à protocole chronométré (fix) où les temps sont absolus. */
  let cues=r.cues||[];
  if(r.full && !r.fix && f.sec!==180) cues=cues.map(c=>[Math.round(c[0]*f.sec/180),c[1]]);
  cues=cues.filter(c=>c[0]<sec-2);
  return Object.assign({},r,{ sec:sec, rest: r.rest===0?0:(r.full? f.rest : r.rest), cues:cues }); }
function bxRounds(s){ return s.rounds.map(bxRound).filter(Boolean); }
function bxDuree(s){ const rs=bxRounds(s); return Math.round(rs.reduce((a,r)=>a+r.sec+r.rest+15,0)/60); }
function bxNbFull(s){ return bxRounds(s).filter(r=>r.t==='sac'||r.t==='ombre').length; }
/* volume de rounds sur les 7 derniers jours — la métrique du boxeur */
function bxSemaine(){ const lim=new Date(); lim.setDate(lim.getDate()-6); const ds=lim.toISOString().slice(0,10);
  return (S.boxeLog||[]).filter(l=>l.date>=ds).reduce((a,l)=>a+(l.rounds||0),0); }

/* la séance du rendez-vous hebdomadaire, selon le sac dispo */
function bxChoix(kind){ const B=bx(); if(B.sac===null) return null;
  const MAP={ condition: B.sac?'s_condition':'o_condition',
              tech:      B.sac?'s_precision':'o_feintes',
              complet:   B.sac?'c_sac':'c_sansac' };
  return BOXE.find(x=>x.id===(MAP[kind]||(B.sac?'s_puissance':'o_distance')))||null; }

/* ================================================================ BOXE — écran */
function renderBoxe(){
  const B=bx();
  main.insertAdjacentHTML('beforeend','<h1 class="page">Boxe</h1><p class="sub" style="margin-bottom:14px">Séances guidées round par round. Un round = un objectif technique, une consigne précise, et le critère qui dit si c\'est réussi.</p>');

  /* ---- 1. sac ou pas : la question qui change tout ---- */
  const sc=document.createElement('div'); sc.className='card';
  sc.innerHTML=`<b style="font-size:15px">🥊 Aujourd'hui, tu as un sac ?</b>
    <p class="sub" style="margin:4px 0 10px">C'est ce qui décide de tes séances : sans sac on construit la technique et la distance, avec sac on construit la frappe et le rythme.</p>
    <div class="bxsel">
      <div class="bxopt${B.sac===true?' on':''}" data-s="1"><span class="i">🛢️</span><b>J'ai un sac</b><small>Frappe, puissance, conditionnement</small></div>
      <div class="bxopt${B.sac===false?' on':''}" data-s="0"><span class="i">👤</span><b>Pas de sac</b><small>Ombre, technique, défense</small></div>
    </div>`;
  main.appendChild(sc);
  sc.querySelectorAll('.bxopt').forEach(o=>o.onclick=()=>{ bx().sac=(o.dataset.s==='1'); save(); render(); });

  if(B.sac===null){
    main.insertAdjacentHTML('beforeend','<div class="empty">Choisis au-dessus pour voir tes séances.</div>');
    bxCodeCard(); return;
  }

  /* ---- 2. format des rounds ---- */
  const f=bxFmt();
  const fc=document.createElement('div'); fc.className='card';
  fc.innerHTML=`<b style="font-size:15px">⏱️ Format des rounds</b>
    <div class="bxfmt">${Object.entries(BXFMT).map(([k,v])=>`<button data-f="${k}" class="${k===B.fmt?'on':''}">${v.nom}</button>`).join('')}</div>
    <p class="sub" style="margin-top:9px">${f.det}</p>`;
  main.appendChild(fc);
  fc.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ bx().fmt=b.dataset.f; save(); render(); });

  /* ---- 3. le volume de la semaine : la métrique du boxeur ---- */
  const vol=bxSemaine(), obj=B.sac?30:24;
  main.insertAdjacentHTML('beforeend',`<div class="card">
    <div class="bxvol"><div><b>${vol}</b><small>rounds sur 7 jours</small></div>
      <div class="vbar"><i style="width:${Math.min(100,vol/obj*100)}%"></i></div></div>
    <p class="sub" style="margin-top:8px">${vol>=obj?"Volume d'un boxeur qui s'entraîne sérieusement. Tiens ça dans la durée et la technique suivra.":vol>=obj/2?"Tu es à mi-chemin d'un vrai volume hebdomadaire ("+obj+" rounds). Le manque se comblera par la régularité, pas par une séance héroïque.":"Un boxeur qui progresse fait "+obj+" rounds par semaine, répartis sur 3 ou 4 séances. Tout se joue là, pas dans l'intensité d'une séance isolée."}</p></div>`);

  /* ---- 4. les séances ---- */
  const TAGS=[['express','⚡ Express · ~15 min'],['standard','🎯 Standard · ~30 min'],['complet','🏛️ Complet · ~50 min']];
  const dispo=BOXE.filter(s=>s.sac===B.sac);
  TAGS.forEach(([tag,titre])=>{
    const list=dispo.filter(s=>s.tag===tag); if(!list.length) return;
    main.insertAdjacentHTML('beforeend',`<div class="cat">${titre}</div>`);
    list.forEach(s=>main.appendChild(bxCard(s)));
  });

  /* les séances de l'autre catégorie restent accessibles */
  const autres=BOXE.filter(s=>s.sac!==B.sac);
  main.insertAdjacentHTML('beforeend',`<div class="cat">${B.sac?'👤 Sans sac — technique pure':'🛢️ Avec sac'}</div>`);
  main.insertAdjacentHTML('beforeend',`<p class="sub" style="margin:-4px 0 10px">${B.sac?"À faire aussi même quand tu as un sac : la technique se construit à vide, où rien ne cache tes défauts.":"Si tu retrouves un sac (salle, club), voilà ce qui t'attend."}</p>`);
  autres.forEach(s=>main.appendChild(bxCard(s)));

  bxCodeCard();

  /* ---- 5. historique ---- */
  const log=(S.boxeLog||[]).slice(-6).reverse();
  if(log.length){
    main.insertAdjacentHTML('beforeend','<div class="cat">Dernières séances</div>');
    log.forEach(l=>main.insertAdjacentHTML('beforeend',`<div class="entry"><div class="eh"><div class="ico">🥊</div>
      <div class="et"><b>${l.nom}</b><small>${frDate(l.date)} · ${l.rounds} rounds · ${l.dur} min${l.rpe?' · RPE '+l.rpe:''}</small></div></div>
      ${l.note?`<div class="body">${escapeH(l.note)}</div>`:''}</div>`));
  }
}

/* une carte de séance, dépliable sur le détail des rounds */
function bxCard(s){
  const rs=bxRounds(s);
  const d=document.createElement('div'); d.className='rout';
  d.innerHTML=`<div class="rh"><span class="ri">${s.emoji}</span>
    <div class="rtx"><b>${s.nom}</b><small>${s.focus} · ${rs.length} rounds · ~${bxDuree(s)} min</small></div><span class="chev">▾</span></div>
    <div class="steps"><div class="rnote">${s.intro}</div>
      ${rs.map((r,i)=>`<div class="st"><span>${Math.round(r.sec/60*10)/10>=1?Math.floor(r.sec/60)+"'"+(r.sec%60?String(r.sec%60).padStart(2,'0'):''):r.sec+'s'}</span>
        <div class="stc">${BXT[r.t].e} ${r.nom}<small class="stwhy">🎯 ${r.but}</small></div></div>`).join('')}</div>
    <button class="btn ${s.sac?'danger':''}" data-go="1">▶ Démarrer</button>`;
  d.querySelector('.rh').onclick=()=>d.classList.toggle('open');
  d.querySelector('[data-go]').onclick=e=>{ e.stopPropagation(); startBoxe(s); };
  return d;
}

function bxCodeCard(){
  main.insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:14px">
    <b style="font-size:15px">📖 Le code des coups</b>
    <p class="sub" style="margin:4px 0 10px">Les consignes utilisent la numérotation des salles de boxe. « Main avant » = ta main de garde (gauche si tu boxes en orthodoxe, droite en southpaw).</p>
    <div class="bxcode">
      <span><b>1</b> Jab (direct main avant)</span><span><b>2</b> Direct arrière</span>
      <span><b>3</b> Crochet avant</span><span><b>4</b> Crochet arrière</span>
      <span><b>5</b> Uppercut avant</span><span><b>6</b> Uppercut arrière</span>
    </div></div>`);
}

/* ================================================================ lecteur de rounds */
function startBoxe(s, planId=null){
  ac();
  const rs=bxRounds(s), PREP=15;
  const phases=[];
  rs.forEach((r,i)=>{ phases.push({kind:'prep',sec:PREP,r,no:i+1});
    phases.push({kind:'work',sec:r.sec,r,no:i+1});
    if(r.rest>0 && i<rs.length-1) phases.push({kind:'rest',sec:r.rest,r,no:i+1,next:rs[i+1]}); });
  let idx=0,left=phases[0].sec,paused=false,timer=null,started=Date.now(),wl=null;
  let showFaire=true, curCue=null, clapped=false;
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  player.classList.add('open'); player.scrollTop=0;
  const mm=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');

  function paint(){ const p=phases[idx], r=p.r, work=(p.kind==='work');
    const deg=Math.max(0,Math.min(360,(1-left/p.sec)*360));
    const col = work ? (r.t==='sac'||r.t==='ombre'?'var(--boxe)':r.t==='phys'?'var(--muscu)':'var(--acc)') : 'var(--dim)';
    let label;
    if(p.kind==='prep') label='Mets-toi en place';
    else if(p.kind==='rest') label='Repos';
    else label=BXT[r.t].n+' · round '+p.no+'/'+rs.length;

    let body='';
    if(p.kind==='prep'){
      body=`<div class="pname">${BXT[r.t].e} ${r.nom}</div>
        <div class="pzone">${BXT[r.t].n} · ${mm(r.sec)}</div>
        <div class="pcue">🎯 ${r.but}</div>
        <ol class="mise">${r.mise.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    } else if(p.kind==='rest'){
      body=`<div class="pname">${mm(left)} de repos</div>
        <div class="bxtest">✔ <b>Le round que tu viens de faire :</b> ${r.test}</div>
        <div class="pcue" style="margin-top:10px">Reste debout, marche, respire par le nez. Ne t'assois pas et ne pose pas les mains sur les genoux : on récupère en mouvement.</div>
        ${p.next?`<div class="bxnext"><small>Round suivant</small><b>${BXT[p.next.t].e} ${p.next.nom}</b><span>${p.next.but}</span></div>`:''}`;
    } else {
      body=`<div class="pname">${BXT[r.t].e} ${r.nom}</div>
        <div class="pzone">🎯 ${r.but}</div>
        ${curCue?`<div class="bxcue">${curCue}</div>`:''}
        <button class="phelp" data-a="faire">${showFaire?'▴ Masquer la consigne':'❔ Revoir la consigne'}</button>
        ${showFaire?`<ol class="mise">${r.faire.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}
        <div class="perr"><b>L'erreur à éviter</b>${r.err}</div>`;
    }

    player.innerHTML=`<div class="player">
      <div class="ptop"><button class="pquit">✕ Quitter</button><span class="pprog">${s.emoji} ${p.no}/${rs.length}</span></div>
      <div class="pbar"><i style="width:${(p.no-1+(p.kind==='work'?(1-left/p.sec):p.kind==='rest'?1:0))/rs.length*100}%"></i></div>
      <div class="pstage ${work?'hold':'prep'}">
        <div class="plabel" style="${work?'color:'+col:''}">${label}</div>
        <div class="ring" style="background:conic-gradient(${col} ${deg}deg, var(--bg3) 0)"><div class="ringin"><div class="ptime" style="font-size:${work?46:52}px">${work?mm(left):left}</div></div></div>
        ${body}</div>
      <div class="pctrl"><button class="pbtn" data-a="prev">‹ Préc.</button>
        <button class="pbtn main" data-a="pause" style="${work?'background:var(--boxe);color:#2a0a0e':''}">${paused?'▶ Reprendre':'❚❚ Pause'}</button>
        <button class="pbtn" data-a="next">Passer ›</button></div></div>`;
    player.querySelector('.pquit').onclick=quit;
    player.querySelector('[data-a="prev"]').onclick=()=>goto(idx-1);
    player.querySelector('[data-a="next"]').onclick=()=>goto(idx+1);
    player.querySelector('[data-a="pause"]').onclick=()=>{ paused=!paused; paint(); };
    const fb=player.querySelector('[data-a="faire"]'); if(fb) fb.onclick=()=>{ showFaire=!showFaire; paint(); };
  }

  function enter(i){ const p=phases[i]; curCue=null; clapped=false; showFaire=true;
    if(p.kind==='work'){ bell(); if(p.r.cues&&p.r.cues.length&&p.r.cues[0][0]===0) curCue=p.r.cues[0][1]; }
    else if(p.kind==='rest'){ bell(); }
    else { beep(520,.18,.35); }
    if(navigator.vibrate) navigator.vibrate(p.kind==='work'?[120,60,120]:40);
  }
  function goto(i){ if(i<0)i=0; if(i>=phases.length){ finish(); return; } idx=i; left=phases[idx].sec; enter(idx); paint(); }

  function step(){ if(paused) return; const p=phases[idx];
    left--;
    if(p.kind==='work'){
      const el=p.sec-left;                             /* secondes écoulées dans le round */
      if(p.r.cues) p.r.cues.forEach(c=>{ if(c[0]===el){ curCue=c[1]; beep(990,.14,.3); if(navigator.vibrate)navigator.vibrate(25); } });
      /* passé 30 s, on a lu la consigne : on rend l'écran au chrono et à la relance */
      if(el===30 && showFaire) showFaire=false;
      if(left===10 && !clapped){ clapped=true; beep(760,.12,.35); beep(760,.12,.35,.18); }  /* le clapper des 10 s */
    }
    if(left<=0){ if(idx>=phases.length-1){ finish(); return; } idx++; left=phases[idx].sec; enter(idx); }
    else if(left<=3 && phases[idx].kind!=='work'){ tick(); }
    paint();
  }
  function stopAll(){ clearInterval(timer); try{wl?.release();}catch(e){} wl=null; }
  function quit(){ if(confirm('Quitter la séance ? Elle ne sera pas enregistrée.')){ stopAll(); player.classList.remove('open'); render(); } }

  function finish(){ stopAll(); bell(); setTimeout(bell,340); setTimeout(bell,680);
    const dur=Math.max(1,Math.round((Date.now()-started)/60000));
    const nb=rs.filter(r=>r.t==='sac'||r.t==='ombre'||r.t==='phys').length;
    let rpe=0;
    player.innerHTML=`<div class="player"><div class="pdone"><div class="big">🥊</div>
      <div style="font-size:24px;font-weight:800;margin:8px 0">Séance bouclée</div>
      <p class="sub">${s.nom} · ${nb} rounds de travail · ${dur} min</p>
      <p class="sub" style="margin-top:12px">Le round que tu as le moins bien tenu est celui qu'il faut refaire en premier la prochaine fois.</p>
      <div style="text-align:left;margin-top:22px">
        <label class="fl">Intensité ressentie (RPE)</label><div class="rpe" id="bRpe">${[...Array(10)].map((_,i)=>`<i data-v="${i+1}">${i+1}</i>`).join('')}</div>
        <label class="fl" style="margin-top:14px">Une note pour toi (facultatif)</label>
        <textarea id="bNote" placeholder="Ce qui a marché, ce qui a coincé, ce que tu retravailles la prochaine fois…"></textarea></div>
      <button class="btn" id="bSave" style="margin-top:16px">Enregistrer la séance</button></div></div>`;
    player.querySelectorAll('#bRpe i').forEach(el=>el.onclick=()=>{ rpe=+el.dataset.v;
      player.querySelectorAll('#bRpe i').forEach(x=>x.classList.toggle('on',+x.dataset.v===rpe)); });
    player.querySelector('#bSave').onclick=()=>{
      S.boxeLog=S.boxeLog||[];
      S.boxeLog.push({id:Date.now(),date:todayStr(),sess:s.id,nom:s.nom,sac:!!s.sac,rounds:nb,dur,rpe,
                      note:player.querySelector('#bNote').value.trim()});
      if(planId) markPlan(planId);
      save(); updateHeader(); player.classList.remove('open');
      toast('Séance enregistrée · '+nb+' rounds 🥊'); render(); };
  }

  enter(0); paint(); timer=setInterval(step,1000);
}
/* ================================================================ JOURNAL */
let draftDisc='boxe', draftRpe=0;
function renderJour(){
  draftDisc='boxe'; draftRpe=0;
  main.insertAdjacentHTML('beforeend',`<h1 class="page">Journal</h1><p class="sub" style="margin-bottom:14px">Ton espace libre : note ce que TU as fait et ton ressenti.</p>`);
  const form=document.createElement('div'); form.className='card';
  form.innerHTML=`<b style="font-size:15px">Nouvelle entrée</b>
    <div class="discgrid" id="discg">${Object.entries(DISC).map(([k,v])=>`<div class="discbtn${k===draftDisc?' on':''}" data-d="${k}" style="${k===draftDisc?'border-color:'+v.col:''}"><span class="i">${v.ico}</span><b>${v.nom}</b></div>`).join('')}</div>
    <label class="fl">Ce que tu as fait</label><textarea id="fFait" placeholder="Ex : 6 rounds sac + gainage…"></textarea>
    <label class="fl">Ton ressenti</label><textarea id="fRess" placeholder="Énergie, sensations, ce qui a marché ou coincé…"></textarea>
    <label class="fl">Intensité ressentie (RPE)</label><div class="rpe" id="fRpe">${[...Array(10)].map((_,i)=>`<i data-v="${i+1}">${i+1}</i>`).join('')}</div>
    <div class="row2"><div><label class="fl">Durée (min)</label><input class="txt" type="number" inputmode="numeric" id="fDur" placeholder="—"></div>
      <div><label class="fl">Date</label><input class="txt" type="date" id="fDate" value="${todayStr()}"></div></div>
    <button class="btn" id="fSave">Enregistrer</button>`;
  main.appendChild(form);
  form.querySelectorAll('.discbtn').forEach(b=>b.onclick=()=>{ draftDisc=b.dataset.d;
    form.querySelectorAll('.discbtn').forEach(x=>{ const on=x.dataset.d===draftDisc; x.classList.toggle('on',on); x.style.borderColor=on?DISC[x.dataset.d].col:''; }); });
  form.querySelectorAll('#fRpe i').forEach(el=>el.onclick=()=>{ draftRpe=+el.dataset.v; form.querySelectorAll('#fRpe i').forEach(x=>x.classList.toggle('on',+x.dataset.v===draftRpe)); });
  form.querySelector('#fSave').onclick=()=>{ const fait=form.querySelector('#fFait').value.trim(), ress=form.querySelector('#fRess').value.trim();
    if(!fait&&!ress) return toast('Écris au moins ce que tu as fait ou ton ressenti.');
    S.journal.push({id:Date.now(),date:form.querySelector('#fDate').value||todayStr(),disc:draftDisc,fait,ressenti:ress,rpe:draftRpe,dur:+form.querySelector('#fDur').value||0});
    save(); toast('Entrée enregistrée ✓'); render(); };
  main.insertAdjacentHTML('beforeend','<div class="cat">Historique</div>');
  if(!S.journal.length){ main.insertAdjacentHTML('beforeend','<div class="empty">Rien pour l\'instant.<br>Ta première note viendra après ta prochaine séance.</div>'); return; }
  [...S.journal].reverse().forEach(e=>{ const v=DISC[e.disc]||DISC.autre;
    const d=document.createElement('div'); d.className='entry';
    d.innerHTML=`<div class="eh"><div class="ico">${v.ico}</div><div class="et"><b>${v.nom}</b><small>${frDate(e.date)}${e.dur?' · '+e.dur+' min':''}${e.rpe?' · RPE '+e.rpe:''}</small></div><span class="del">✕</span></div>
      ${(e.fait||e.ressenti)?`<div class="body">${e.fait?`<span class="lab">Fait</span>${escapeH(e.fait)}`:''}${e.ressenti?`<span class="lab">Ressenti</span>${escapeH(e.ressenti)}`:''}</div>`:''}`;
    d.querySelector('.del').onclick=()=>{ if(confirm('Supprimer cette entrée ?')){ S.journal=S.journal.filter(x=>x.id!==e.id); save(); render(); } };
    main.appendChild(d); });
}

/* ================================================================ PROGRÈS */
function renderProg(){
  main.insertAdjacentHTML('beforeend','<h1 class="page">Progrès</h1>');
  const mobMin=S.mobLog.reduce((a,m)=>a+(m.dur||0),0), wkMin=S.workoutLog.reduce((a,w)=>a+(w.dur||0),0);
  main.insertAdjacentHTML('beforeend',`<div class="statgrid">
    <div class="stat"><b>${dayStreak()}</b><small>jours d'affilée</small></div>
    <div class="stat"><b>${S.mobLog.length}</b><small>séances souplesse/core</small></div>
    <div class="stat"><b>${S.workoutLog.filter(w=>w.cali).length}</b><small>séances calisthénie</small></div>
    <div class="stat"><b>${(S.boxeLog||[]).length}</b><small>séances boxe</small></div>
    <div class="stat"><b>${bxSemaine()}</b><small>rounds de boxe (7 j)</small></div>
    <div class="stat"><b>${Math.round((mobMin+wkMin)/60*10)/10}h</b><small>temps total guidé</small></div></div>`);

  /* les niveaux de calisthénie : où tu en es sur la route planche / HSPU */
  { const C=cali(); const lc=document.createElement('div'); lc.className='card'; lc.style.marginTop='12px';
    lc.innerHTML='<b style="font-size:15px">🤸 Niveaux de calisthénie</b>'+(C.placed?'':'<p class="sub" style="margin-top:4px">Fais le test de niveau (onglet Cali) pour partir du bon endroit.</p>');
    trackList().forEach(tk=>{ const Tk=TRACKS[tk], i=lvOf(tk);
      lc.insertAdjacentHTML('beforeend',`<div class="trk"><span class="te">${Tk.emoji}</span><div class="tt"><b>${Tk.nom}<i>niv. ${i+1}/${Tk.lv.length}</i></b><small>${Tk.lv[i].nom}</small>
        <div class="lvbar">${Tk.lv.map((_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div></div></div>`); });
    const ups=C.hist.filter(h=>h.to>h.from&&h.why!=='test').slice(-6).reverse();
    if(ups.length) lc.insertAdjacentHTML('beforeend','<div class="cat" style="margin-top:14px">Dernières montées</div>'+ups.map(h=>`<div class="prrow"><div class="t"><b>${TRACKS[h.tk]?TRACKS[h.tk].emoji+' '+TRACKS[h.tk].lv[h.to].nom:h.tk}</b><small>${h.date.split('-').reverse().join('/')}</small></div><div class="val">niv. ${h.to+1}</div></div>`).join(''));
    main.appendChild(lc); }
  const fc=document.createElement('div'); fc.className='card'; fc.style.marginTop='12px';
  fc.innerHTML='<b style="font-size:15px">📏 Test du sol</b>';
  if(!S.floorTests.length) fc.insertAdjacentHTML('beforeend','<div class="empty">Fais ton premier test (onglet Aujourd\'hui).</div>');
  else { const cur=curFloor();
    fc.insertAdjacentHTML('beforeend',`<p class="sub" style="margin-top:4px">Niveau actuel : <b style="color:var(--acc)">${FLOOR[cur]}</b>. La courbe doit grimper.</p>`+sparkline(S.floorTests.map(t=>t.level),0,FLOOR.length-1)
      +`<div class="legend" style="justify-content:space-between;margin-top:4px"><span>${FLOOR[0]}</span><span>${FLOOR[FLOOR.length-1]}</span></div>`); }
  main.appendChild(fc);

  const prs=Object.entries(S.prReps);
  if(prs.length){ const prc=document.createElement('div'); prc.className='card'; prc.innerHTML='<b style="font-size:15px">🏆 Records</b>';
    prs.sort((a,b)=>b[1].date.localeCompare(a[1].date)).forEach(([ex,p])=>prc.insertAdjacentHTML('beforeend',`<div class="prrow"><div class="t"><b>${ex}</b><small>${p.date.split('-').reverse().join('/')}</small></div><div class="val">${p.reps} ${p.u==='s'?'s':'reps'}</div></div>`));
    main.appendChild(prc); }

  const hm=document.createElement('div'); hm.className='card'; hm.innerHTML='<b style="font-size:15px">Régularité (16 semaines)</b><div class="heatwrap"><div class="heat"></div></div>';
  const heat=hm.querySelector('.heat');
  const mob=new Set(S.mobLog.map(m=>m.date)), wk=new Set(S.workoutLog.map(w=>w.date)), jr=new Set(S.journal.map(j=>j.date)), bxd=new Set((S.boxeLog||[]).map(b=>b.date));
  const today=new Date(); const dow=(today.getDay()+6)%7; const start=new Date(today); start.setDate(start.getDate()-dow-15*7);
  for(let i=0;i<16*7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const ds=d.toISOString().slice(0,10); const cell=document.createElement('i');
    if(d>today) cell.style.visibility='hidden';
    else { const m=mob.has(ds),w=wk.has(ds),j=jr.has(ds),b=bxd.has(ds);
      if(b) cell.style.background='var(--boxe)'; else if(w) cell.style.background='var(--muscu)'; else if(m) cell.style.background='var(--acc)'; else if(j) cell.style.background='var(--jour)';
      if(m||w||j||b) cell.title=ds; } heat.appendChild(cell); }
  hm.insertAdjacentHTML('beforeend',`<div class="legend"><span><i style="background:var(--boxe)"></i>Boxe</span><span><i style="background:var(--muscu)"></i>Calisthénie</span><span><i style="background:var(--acc)"></i>Souplesse/core</span><span><i style="background:var(--jour)"></i>Journal</span></div>`);
  main.appendChild(hm);
}
function sparkline(vals,fmn,fmx){ const w=320,h=110,pad=14;
  const mn=fmn!=null?fmn:Math.min(...vals), mx=fmx!=null?fmx:Math.max(...vals);
  const sx=i=>pad+(vals.length===1?(w/2-pad):i*(w-2*pad)/(vals.length-1));
  const sy=v=>mx===mn?h/2:h-pad-(v-mn)*(h-2*pad)/(mx-mn);
  const pts=vals.map((v,i)=>sx(i)+','+sy(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="var(--acc)"/>`).join('')}</svg>`; }

/* ================================================================ OVERLAY + utils */
const overlay=document.getElementById('overlay'), overlayInner=document.getElementById('overlayInner');
function closeOverlay(){ overlay.classList.remove('open'); }
function openCustom(title,fill){ overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`;
  overlayInner.querySelector('.back').onclick=closeOverlay; overlay.classList.add('open'); overlay.scrollTop=0; fill(overlayInner,closeOverlay); }
function escapeH(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>'); }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

/* ---------------- init ---------------- */
if(S.curWk){ curTab='sess'; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='sess')); }
render();

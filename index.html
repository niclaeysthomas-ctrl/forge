<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href='data:application/manifest+json,{"name":"FORGE — souplesse & journal","short_name":"Forge","display":"standalone","background_color":"#0c0f0e","theme_color":"#0c0f0e","start_url":"."}'>
<title>FORGE — souplesse guidée & journal</title>
<style>
  :root{
    --bg:#0c0f0e; --bg2:#141a18; --bg3:#1c2422; --line:#2a352f;
    --txt:#e9f2ee; --dim:#8aa39a;
    --acc:#5ad1a5; --accd:#2fae86;
    --boxe:#ff5c6c; --muscu:#f5b840; --mix:#5b9cff; --autre:#8aa39a;
    --ok:#3ecf7a; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 120px}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:2px}
  .logo span{color:var(--acc)}
  .badge{font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#122019,#132a24);border:1px solid var(--line)}
  .hero .lvl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .hero .lvlname{font-size:22px;font-weight:800;margin:2px 0 6px;color:var(--acc)}
  .hero p{font-size:13px;color:var(--dim);line-height:1.5}

  .btn{display:block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#062018;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;margin-top:0;display:inline-block}
  .btn.danger{background:#3a1a20;color:var(--boxe);border:1px solid #55232c}
  h1.page{font-size:22px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--dim);font-size:13px;line-height:1.5}
  .cat{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 8px;font-weight:700}

  /* routines */
  .rout{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
  .rout .rh{display:flex;align-items:center;gap:12px}
  .rout .ri{font-size:26px}
  .rout .rt{flex:1;min-width:0}
  .rout .rt b{font-size:16px;display:block}
  .rout .rt small{color:var(--dim);font-size:12px}
  .rout .chev{color:var(--dim);padding:6px;font-size:14px}
  .rout .steps{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .rout.open .steps{display:block}
  .rout .steps .st{display:flex;gap:10px;padding:7px 0;font-size:13px;color:#cfe0d9;align-items:baseline}
  .rout .steps .st span{color:var(--dim);font-size:12px;min-width:38px}
  .rout .steps .st em{color:var(--dim);font-style:normal;margin-left:auto;font-size:12px}

  /* test du sol */
  .floor{display:flex;align-items:center;gap:14px}
  .floor .big{font-size:34px}
  .floor .ft{flex:1}
  .floor .ft b{font-size:16px;display:block}
  .floor .ft small{color:var(--dim);font-size:12px}
  .levels{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .lvlopt{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
    padding:13px;cursor:pointer;font-weight:600;font-size:15px}
  .lvlopt.on{border-color:var(--acc);background:#12261e}
  .lvlopt .n{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dim);flex-shrink:0}
  .lvlopt.on .n{background:var(--acc);color:#062018;border-color:var(--acc)}

  /* journal */
  .discgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0 4px}
  .discbtn{border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--bg3)}
  .discbtn:active{transform:scale(.96)}
  .discbtn .i{font-size:22px;display:block;margin-bottom:3px}
  .discbtn b{font-size:12px}
  .discbtn.on{border-width:2px}
  textarea,input.txt{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;
    color:var(--txt);font-size:15px;outline:none;font-family:inherit;resize:vertical;margin-top:10px}
  textarea{min-height:64px;line-height:1.5}
  label.fl{font-size:12px;color:var(--dim);font-weight:700;display:block;margin-top:14px}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1}
  input.txt[type=date],input.txt[type=number]{margin-top:6px}
  .rpe{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .rpe i{width:calc((100% - 45px)/10);min-width:26px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .rpe i.on{background:var(--acc);color:#062018;border-color:var(--acc)}

  .entry{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .entry .eh{display:flex;align-items:center;gap:10px}
  .entry .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg3)}
  .entry .et{flex:1;min-width:0}
  .entry .et b{font-size:15px;display:block}
  .entry .et small{color:var(--dim);font-size:12px}
  .entry .del{color:var(--dim);padding:4px 8px;cursor:pointer}
  .entry .body{margin-top:10px;font-size:14px;line-height:1.55;color:#cfe0d9}
  .entry .body .lab{color:var(--dim);font-size:12px;font-weight:700;display:block;margin-top:6px}
  .entry .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:auto}

  /* progress */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--acc)}
  .stat small{color:var(--dim);font-size:12px}
  .heatwrap{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;margin-top:10px}
  .heat i{width:13px;height:13px;border-radius:3px;background:var(--bg3)}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--dim);font-weight:700;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  svg.chart{width:100%;height:130px;margin-top:8px}
  .empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px;line-height:1.7}
  .tip{display:flex;gap:10px;font-size:13.5px;color:#cfe0d9;line-height:1.5;margin-bottom:9px}
  .tip span{flex-shrink:0}

  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,14,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;cursor:pointer}
  nav button .i{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}

  #toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-90px);
    background:var(--bg3);border:1px solid var(--acc);color:var(--txt);padding:12px 22px;border-radius:14px;font-weight:700;
    z-index:100;transition:transform .35s;font-size:15px;max-width:92%;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* overlay */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .inner{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .topbar .back{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}
  .topbar b{font-size:16px}

  /* lecteur guidé */
  .player{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 30px;min-height:100vh;display:flex;flex-direction:column}
  .ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .ptop .pquit{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .ptop .pprog{color:var(--dim);font-size:13px;font-weight:700}
  .pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .pbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
  .pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .plabel{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .pstage.hold .plabel{color:var(--acc)}
  .ring{width:210px;height:210px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:8px 0 4px;
    transition:background .3s}
  .ringin{width:186px;height:186px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .ptime{font-size:66px;font-weight:900;font-variant-numeric:tabular-nums}
  .pname{font-size:22px;font-weight:800}
  .pzone{font-size:13px;color:var(--acc);font-weight:700}
  .pcue{font-size:15px;color:#cfe0d9;line-height:1.55;max-width:420px;margin-top:6px}
  .pctrl{display:flex;gap:10px;margin-top:18px}
  .pctrl .pbtn{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:15px 8px;
    font-size:14px;font-weight:700;cursor:pointer}
  .pctrl .pbtn.main{flex:1.4;background:var(--acc);color:#062018}
  .pctrl .pbtn:active{transform:scale(.97)}
  .pdone{text-align:center;padding:30px 0}
  .pdone .big{font-size:60px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">FOR<span>GE</span></div>
    <div class="badge" id="streakBadge">🔥 0 j</div>
  </header>
  <main id="main"></main>
  <nav><div class="in">
    <button data-tab="soup" class="on"><span class="i">🧘</span>Souplesse</button>
    <button data-tab="jour"><span class="i">📓</span>Journal</button>
    <button data-tab="prog"><span class="i">📈</span>Progrès</button>
  </div></nav>
</div>
<div class="overlay" id="overlay"><div class="inner" id="overlayInner"></div></div>
<div class="overlay" id="player"></div>
<div id="toast"></div>

<script>
/* ================================================================
   FORGE — souplesse guidée & journal libre
   ================================================================ */

/* ---------------- contenu souplesse ---------------- */
// step : {emoji, nom, zone, cue, sec, sides?}
const ROUTINES=[
  { id:'plancher', emoji:'🎯', nom:'Vers le sol', focus:"Toucher le sol : ischios, hanches, dos", steps:[
    {emoji:'🐈',nom:'Chat–vache',zone:'Mobilité du dos',cue:'À quatre pattes, alterne dos rond (souffle) et dos creux (inspire), lentement.',sec:40},
    {emoji:'🦵',nom:'Balancés jambe tendue',zone:'Réveil des ischios',cue:"Debout, appuie-toi d'une main, balance une jambe tendue d'avant en arrière. Amplitude douce, sans à-coups.",sec:25,sides:true},
    {emoji:'⬇️',nom:'Flexion avant debout',zone:'Chaîne postérieure',cue:'Pieds largeur de bassin, descends lentement, genoux à peine fléchis, relâche nuque et bras. Laisse la gravité travailler, ne tire pas.',sec:45},
    {emoji:'🦿',nom:'Étirement ischios (assis)',zone:'Ischio-jambiers',cue:"Assis, une jambe tendue, l'autre repliée. Penche-toi vers le pied tendu en gardant le dos long, pas rond.",sec:35,sides:true},
    {emoji:'📐',nom:'Pince assise',zone:'Ischios & bas du dos',cue:'Jambes tendues devant, avance les mains vers les pieds en soufflant. Vise le ventre sur les cuisses, pas le nez sur les genoux.',sec:45},
    {emoji:'🧱',nom:'Mollet au mur',zone:'Mollets & chevilles',cue:'Mains au mur, une jambe tendue derrière, talon ancré au sol, pousse le mur.',sec:30,sides:true},
    {emoji:'🏹',nom:'Fente basse',zone:'Fléchisseurs de hanche',cue:"Un genou au sol, l'autre pied devant, pousse doucement le bassin vers l'avant. Buste droit.",sec:35,sides:true},
    {emoji:'🦋',nom:'Papillon',zone:'Adducteurs (intérieur cuisses)',cue:'Assis, plantes des pieds jointes, laisse les genoux descendre vers le sol, dos droit. Respire.',sec:40},
    {emoji:'🕊️',nom:'Pigeon simplifié',zone:'Fessiers & hanches',cue:"Une jambe repliée devant toi, l'autre tendue derrière. Penche le buste au-dessus de la jambe avant.",sec:35,sides:true},
    {emoji:'🌀',nom:'Torsion allongée',zone:'Bas du dos',cue:"Sur le dos, amène un genou plié de l'autre côté, épaules au sol, regarde à l'opposé.",sec:30,sides:true},
    {emoji:'🧎',nom:"Posture de l'enfant",zone:'Relâchement du dos',cue:'À genoux, fesses vers les talons, bras tendus devant, front au sol. Respire profondément, relâche tout.',sec:45},
  ]},
  { id:'express', emoji:'⚡', nom:'Express 5 min', focus:'Le minimum quotidien', steps:[
    {emoji:'⬇️',nom:'Flexion avant debout',zone:'Chaîne postérieure',cue:'Descends lentement, genoux souples, relâche la nuque. Respire et laisse-toi descendre à chaque expiration.',sec:45},
    {emoji:'📐',nom:'Pince assise',zone:'Ischios & bas du dos',cue:'Jambes tendues, avance les mains vers les pieds en soufflant, dos long.',sec:45},
    {emoji:'🏹',nom:'Fente basse',zone:'Fléchisseurs de hanche',cue:'Un genou au sol, pousse le bassin vers l\'avant, buste droit.',sec:30,sides:true},
    {emoji:'🦋',nom:'Papillon',zone:'Adducteurs',cue:'Plantes des pieds jointes, genoux qui descendent, dos droit.',sec:40},
    {emoji:'🧎',nom:"Posture de l'enfant",zone:'Relâchement',cue:'Front au sol, bras tendus, respire profondément.',sec:40},
  ]},
  { id:'hanches', emoji:'🦵', nom:'Hanches & bassin', focus:'Ouverture des hanches', steps:[
    {emoji:'🔄',nom:'Cercles de hanches',zone:'Mobilité hanches',cue:'Debout, mains sur les hanches, dessine de grands cercles avec le bassin, dans les deux sens.',sec:30},
    {emoji:'🏹',nom:'Fente basse',zone:'Fléchisseurs de hanche',cue:"Genou au sol, pousse le bassin vers l'avant. Buste droit, respire.",sec:40,sides:true},
    {emoji:'🦋',nom:'Papillon',zone:'Adducteurs',cue:'Plantes jointes, genoux vers le sol, dos droit. Ne force pas avec les mains.',sec:45},
    {emoji:'🐸',nom:'Grenouille douce',zone:'Adducteurs profonds',cue:'À quatre pattes, écarte les genoux progressivement, avance/recule le bassin en douceur. Aucune douleur.',sec:40},
    {emoji:'🕊️',nom:'Pigeon simplifié',zone:'Fessiers & hanches',cue:'Jambe repliée devant, jambe tendue derrière, penche le buste vers l\'avant.',sec:40,sides:true},
    {emoji:'📐',nom:'Position 90/90',zone:'Rotation des hanches',cue:'Assis, une jambe pliée devant à 90°, l\'autre pliée sur le côté à 90°. Buste droit, penche légèrement vers l\'avant.',sec:35,sides:true},
    {emoji:'🦿',nom:'Étirement fessier (au sol)',zone:'Fessiers',cue:'Sur le dos, croise une cheville sur le genou opposé et ramène la cuisse vers toi.',sec:35,sides:true},
    {emoji:'🧎',nom:"Posture de l'enfant",zone:'Relâchement',cue:'Front au sol, bras tendus, respire.',sec:40},
  ]},
  { id:'complete', emoji:'🧘', nom:'Complète', focus:'Tout le corps', steps:[
    {emoji:'🐈',nom:'Chat–vache',zone:'Mobilité du dos',cue:'Alterne dos rond / dos creux au rythme du souffle.',sec:40},
    {emoji:'🙆',nom:'Nuque (inclinaisons)',zone:'Cou',cue:'Incline doucement la tête vers une épaule, main légère pour accompagner. Sans forcer.',sec:20,sides:true},
    {emoji:'💪',nom:'Épaule croisée',zone:'Épaules',cue:'Bras tendu devant la poitrine, l\'autre main le rapproche du corps.',sec:25,sides:true},
    {emoji:'⬇️',nom:'Flexion avant debout',zone:'Chaîne postérieure',cue:'Descends lentement, relâche la nuque, laisse la gravité travailler.',sec:45},
    {emoji:'📐',nom:'Pince assise',zone:'Ischios & bas du dos',cue:'Mains vers les pieds en soufflant, dos long.',sec:45},
    {emoji:'🦿',nom:'Étirement ischios (assis)',zone:'Ischio-jambiers',cue:'Une jambe tendue, penche-toi vers le pied, dos long.',sec:35,sides:true},
    {emoji:'🏹',nom:'Fente basse',zone:'Fléchisseurs de hanche',cue:'Pousse le bassin vers l\'avant, buste droit.',sec:35,sides:true},
    {emoji:'🦵',nom:'Quadriceps debout',zone:'Avant des cuisses',cue:'Attrape une cheville derrière toi, genoux serrés, pousse le bassin en avant. Appuie-toi si besoin.',sec:30,sides:true},
    {emoji:'🦋',nom:'Papillon',zone:'Adducteurs',cue:'Plantes jointes, genoux vers le sol, dos droit.',sec:40},
    {emoji:'🕊️',nom:'Pigeon simplifié',zone:'Fessiers & hanches',cue:'Buste au-dessus de la jambe avant repliée.',sec:35,sides:true},
    {emoji:'🌀',nom:'Torsion allongée',zone:'Bas du dos',cue:'Genou plié amené de l\'autre côté, épaules au sol.',sec:30,sides:true},
    {emoji:'🧎',nom:"Posture de l'enfant",zone:'Relâchement',cue:'Front au sol, respire profondément, relâche tout.',sec:45},
  ]},
];
const FLOOR=[
  'À hauteur des genoux','Mi-mollets','Chevilles','Bout des doigts au sol','Paumes à plat au sol'
];
const DISC={
  boxe:{ico:'🥊',nom:'Boxe',col:'var(--boxe)'},
  muscu:{ico:'🏋️',nom:'Muscu',col:'var(--muscu)'},
  mix:{ico:'🔀',nom:'Mix',col:'var(--mix)'},
  autre:{ico:'✳️',nom:'Autre',col:'var(--autre)'},
};

/* ---------------- état ---------------- */
const DEFAULT={ mobLog:[], journal:[], floorTests:[] };
let S=load();
function load(){ try{ return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem('forge_v2')||'{}')); }catch(e){ return {...DEFAULT}; } }
function save(){ localStorage.setItem('forge_v2',JSON.stringify(S)); }
const todayStr=()=>new Date().toISOString().slice(0,10);
const frDate=ds=>new Date(ds+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

/* activité & streak (jours consécutifs avec ≥1 chose faite) */
function activityDays(){ const set=new Set(); S.mobLog.forEach(m=>set.add(m.date)); S.journal.forEach(j=>set.add(j.date)); return set; }
function dayStreak(){ const days=activityDays(); const ds=x=>x.toISOString().slice(0,10);
  let d=new Date(); let n=0;
  if(!days.has(ds(d))) d.setDate(d.getDate()-1); // aujourd'hui pas encore fait ne casse pas la série
  while(days.has(ds(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function curFloor(){ if(!S.floorTests.length) return null; return S.floorTests[S.floorTests.length-1].level; }
function updateHeader(){ document.getElementById('streakBadge').textContent='🔥 '+dayStreak()+' j'; }

/* ---------------- audio ---------------- */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} return AC; }
function beep(f=880,dur=.12,vol=.4,when=0){ const ctx=ac(); if(!ctx)return;
  const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.02);
}
function bell(){ beep(587,.4,.5); beep(784,.5,.4,.06); if(navigator.vibrate)navigator.vibrate([100,50,100]); }
function tick(){ beep(1150,.05,.22); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }

/* ================================================================

   ================================================================ */
const main=document.getElementById('main');
let curTab='soup';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curTab=b.dataset.tab; render();

    <div class="card hero">

        <div class="tip"><span>🚫</span><div>Étirement = tension confortable, jamais douleur vive. Pas de à-coups, pas de « ressorts ».</div></div>
        <div class="tip"><span>🔁</span><div>Le progrès vient de la fréquence. Vise un petit peu chaque jour plutôt que beaucoup rarement.</div></div>

  main.querySelector('#floorBtn').onclick=openFloorTest;

    const d=document.createElement('div'); d.className='rout';

      <div class="steps">${r.steps.map(s=>`<div class="st"><span>${s.sec}s${s.sides?' ×2':''}</span><div>${s.emoji} ${s.nom}<em>${s.zone}</em></div></div>`).join('')}</div>

function openFloorTest(){
  openCustom('Test du sol',(inner,close)=>{
    inner.insertAdjacentHTML('beforeend',`<p class="sub" style="margin-bottom:14px">Debout, jambes tendues, penche-toi lentement vers le sol sans forcer. Jusqu'où arrivent tes mains ? Note ton niveau honnêtement — c'est ta ligne de départ.</p>`);
    const cur=curFloor();
    const wrap=document.createElement('div'); wrap.className='levels';
    FLOOR.forEach((lab,i)=>{
      const o=document.createElement('div'); o.className='lvlopt'+(cur===i?' on':'');
      o.innerHTML=`<span class="n">${i}</span><span>${lab}</span>`;
      o.onclick=()=>{
        S.floorTests.push({date:todayStr(),level:i}); save();
        toast('Test du sol enregistré 📏'); close(); render();
      };
      wrap.appendChild(o);
    });
    inner.appendChild(wrap);
  });
}

/* ---------------- lecteur guidé ---------------- */
const player=document.getElementById('player');
function startRoutine(routine){
  ac(); // débloque le son (geste utilisateur)
  const phases=[];
  routine.steps.forEach(s=>{
    phases.push({kind:'prep',sec:6,s});
    if(s.sides){ phases.push({kind:'hold',side:'gauche',sec:s.sec,s}); phases.push({kind:'hold',side:'droite',sec:s.sec,s}); }
    else phases.push({kind:'hold',sec:s.sec,s});
  });
  const holdTotal=phases.filter(p=>p.kind==='hold').length;
  let idx=0,left=phases[0].sec,paused=false,timer=null,started=Date.now(),wl=null;
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  player.classList.add('open'); player.scrollTop=0;

  const holdNo=i=>{ let n=0; for(let k=0;k<=i;k++) if(phases[k].kind==='hold') n++; return n; };
  function paint(){
    const p=phases[idx], isPrep=p.kind==='prep';
    const deg=Math.max(0,Math.min(360,(1-left/p.sec)*360));
    const doneHolds=isPrep?holdNo(idx):holdNo(idx)-1;           // maintiens déjà terminés
    const displayNo=Math.min(holdTotal,isPrep?holdNo(idx)+1:holdNo(idx)); // n° du maintien en cours/à venir
    const nextSide=isPrep && phases[idx+1] ? phases[idx+1].side : null;
    player.innerHTML=`<div class="player">
      <div class="ptop"><button class="pquit">✕ Quitter</button><span class="pprog">Mouvement ${displayNo}/${holdTotal}</span></div>
      <div class="pbar"><i style="width:${doneHolds/holdTotal*100}%"></i></div>
      <div class="pstage ${isPrep?'prep':'hold'}">
        <div class="plabel">${isPrep?('Prépare-toi'+(nextSide?' · côté '+nextSide:'')):(p.side?'Maintiens · côté '+p.side:'Maintiens')}</div>
        <div class="ring" style="background:conic-gradient(${isPrep?'var(--dim)':'var(--acc)'} ${deg}deg, var(--bg3) 0)">
          <div class="ringin"><div class="ptime">${left}</div></div>
        </div>
        <div class="pname">${p.s.emoji} ${p.s.nom}</div>
        <div class="pzone">${p.s.zone}</div>
        <div class="pcue">${p.s.cue}</div>
      </div>
      <div class="pctrl">
        <button class="pbtn" data-a="prev">‹ Préc.</button>
        <button class="pbtn main" data-a="pause">${paused?'▶ Reprendre':'❚❚ Pause'}</button>
        <button class="pbtn" data-a="next">Passer ›</button>
      </div>
    </div>`;
    player.querySelector('.pquit').onclick=quit;
    player.querySelector('[data-a="prev"]').onclick=()=>goto(idx-1);
    player.querySelector('[data-a="next"]').onclick=()=>goto(idx+1);
    player.querySelector('[data-a="pause"]').onclick=()=>{ paused=!paused; paint(); };
  }
  function goto(i){ if(i<0)i=0; if(i>=phases.length){ finish(); return; } idx=i; left=phases[idx].sec; cue(phases[idx]); paint(); }
  function cue(p){ if(p.kind==='hold') beep(660,.25,.4); else beep(440,.15,.3); if(navigator.vibrate)navigator.vibrate(30); }
  function step(){ if(paused)return;
    left--;
    if(left<=0){ if(idx>=phases.length-1){ finish(); return; } idx++; left=phases[idx].sec; cue(phases[idx]); }
    else if(left<=3 && phases[idx].kind==='hold'){ tick(); }
    paint();
  }
  function stopAll(){ clearInterval(timer); try{wl?.release();}catch(e){} wl=null; }
  function quit(){ if(confirm('Quitter la séance ? Elle ne sera pas enregistrée.')){ stopAll(); player.classList.remove('open'); } }
  function finish(){
    stopAll(); bell(); setTimeout(bell,350);
    const dur=Math.max(1,Math.round((Date.now()-started)/60000));
    S.mobLog.push({id:Date.now(),date:todayStr(),routine:routine.nom,dur}); save(); updateHeader();
    player.innerHTML=`<div class="player"><div class="pdone">
      <div class="big">🧘</div>
      <div style="font-size:24px;font-weight:800;margin:8px 0">Séance terminée</div>
      <p class="sub">${routine.nom} · ${dur} min · ${dayStreak()} jour(s) d'affilée 🔥</p>
      <p class="sub" style="margin-top:14px">Le progrès se joue dans la régularité. Reviens demain, même 5 minutes.</p>
      <button class="btn" id="pfloor" style="margin-top:20px">📏 Refaire le test du sol</button>
      <button class="btn ghost" id="pclose">Terminer</button>
    </div></div>`;
    player.querySelector('#pclose').onclick=()=>{ player.classList.remove('open'); render(); };
    player.querySelector('#pfloor').onclick=()=>{ player.classList.remove('open'); render(); openFloorTest(); };
  }
  cue(phases[0]); paint();
  timer=setInterval(step,1000);
}

/* ================================================================
   ONGLET JOURNAL (libre — boxe / muscu, tes ressentis)
   ================================================================ */
let draftDisc='boxe', draftRpe=0;
function renderJour(){
  draftDisc='boxe'; draftRpe=0;
  main.insertAdjacentHTML('beforeend',`<h1 class="page">Journal</h1>
    <p class="sub" style="margin-bottom:14px">Ton espace : note ce que TU as fait (boxe, muscu, mix…) et ton ressenti. Rien n'est imposé.</p>`);

  const form=document.createElement('div'); form.className='card';
  form.innerHTML=`
    <b style="font-size:15px">Nouvelle entrée</b>
    <div class="discgrid" id="discg">
      ${Object.entries(DISC).map(([k,v])=>`<div class="discbtn${k===draftDisc?' on':''}" data-d="${k}" style="${k===draftDisc?'border-color:'+v.col:''}"><span class="i">${v.ico}</span><b>${v.nom}</b></div>`).join('')}
    </div>
    <label class="fl">Ce que tu as fait</label>
    <textarea id="fFait" placeholder="Ex : 6 rounds sac + 3×10 tractions, ou 4 exos jambes lourds…"></textarea>
    <label class="fl">Ton ressenti</label>
    <textarea id="fRess" placeholder="Énergie, sensations, ce qui a marché ou coincé, douleur éventuelle…"></textarea>
    <div class="row2">
      <div><label class="fl">Intensité ressentie (RPE)</label>
        <div class="rpe" id="fRpe">${[...Array(10)].map((_,i)=>`<i data-v="${i+1}">${i+1}</i>`).join('')}</div></div>
    </div>
    <div class="row2">
      <div><label class="fl">Durée (min)</label><input class="txt" type="number" inputmode="numeric" id="fDur" placeholder="—"></div>
      <div><label class="fl">Date</label><input class="txt" type="date" id="fDate" value="${todayStr()}"></div>
    </div>
    <button class="btn" id="fSave">Enregistrer</button>`;
  main.appendChild(form);

  form.querySelectorAll('.discbtn').forEach(b=>b.onclick=()=>{
    draftDisc=b.dataset.d;
    form.querySelectorAll('.discbtn').forEach(x=>{ const on=x.dataset.d===draftDisc;
      x.classList.toggle('on',on); x.style.borderColor=on?DISC[x.dataset.d].col:''; });
  });
  form.querySelectorAll('#fRpe i').forEach(el=>el.onclick=()=>{
    draftRpe=+el.dataset.v;
    form.querySelectorAll('#fRpe i').forEach(x=>x.classList.toggle('on',+x.dataset.v===draftRpe));
  });
  form.querySelector('#fSave').onclick=()=>{
    const fait=form.querySelector('#fFait').value.trim();
    const ress=form.querySelector('#fRess').value.trim();
    if(!fait && !ress) return toast('Écris au moins ce que tu as fait ou ton ressenti.');
    S.journal.push({ id:Date.now(), date:form.querySelector('#fDate').value||todayStr(),
      disc:draftDisc, fait, ressenti:ress, rpe:draftRpe,
      dur:+form.querySelector('#fDur').value||0 });
    save(); toast('Entrée enregistrée ✓'); render();
  };

  main.insertAdjacentHTML('beforeend','<div class="cat">Historique</div>');
  if(!S.journal.length){
    main.insertAdjacentHTML('beforeend','<div class="empty">Rien pour l\'instant.<br>Ta première note viendra après ta prochaine séance.</div>');
    return;
  }
  [...S.journal].reverse().forEach(e=>{
    const v=DISC[e.disc]||DISC.autre;
    const d=document.createElement('div'); d.className='entry';
    d.innerHTML=`
      <div class="eh">
        <div class="ico">${v.ico}</div>
        <div class="et"><b>${v.nom}</b><small>${frDate(e.date)}${e.dur?' · '+e.dur+' min':''}${e.rpe?' · RPE '+e.rpe:''}</small></div>
        <span class="del">✕</span>
      </div>
      ${(e.fait||e.ressenti)?`<div class="body">
        ${e.fait?`<span class="lab">Fait</span>${escapeH(e.fait)}`:''}
        ${e.ressenti?`<span class="lab">Ressenti</span>${escapeH(e.ressenti)}`:''}
      </div>`:''}`;
    d.querySelector('.del').onclick=()=>{ if(confirm('Supprimer cette entrée ?')){ S.journal=S.journal.filter(x=>x.id!==e.id); save(); render(); } };
    main.appendChild(d);
  });
}

/* ================================================================
   ONGLET PROGRÈS
   ================================================================ */
function renderProg(){
  main.insertAdjacentHTML('beforeend','<h1 class="page">Progrès</h1>');
  const totMob=S.mobLog.length, totMin=S.mobLog.reduce((a,m)=>a+(m.dur||0),0);
  main.insertAdjacentHTML('beforeend',`<div class="statgrid">
    <div class="stat"><b>${dayStreak()}</b><small>jours d'affilée</small></div>
    <div class="stat"><b>${totMob}</b><small>séances souplesse</small></div>
    <div class="stat"><b>${S.journal.length}</b><small>entrées de journal</small></div>
    <div class="stat"><b>${Math.round(totMin/60*10)/10}h</b><small>souplesse cumulée</small></div>
  </div>`);

  /* progression du test du sol */
  const fc=document.createElement('div'); fc.className='card'; fc.style.marginTop='12px';
  const cur=curFloor();
  fc.innerHTML=`<b style="font-size:15px">📏 Test du sol</b>`;
  if(!S.floorTests.length){
    fc.insertAdjacentHTML('beforeend','<div class="empty">Fais ton premier test dans l\'onglet Souplesse pour poser ta ligne de départ.</div>');
  } else {
    fc.insertAdjacentHTML('beforeend',`<p class="sub" style="margin-top:4px">Niveau actuel : <b style="color:var(--acc)">${FLOOR[cur]}</b>. La courbe doit grimper avec les semaines.</p>`);
    const vals=S.floorTests.map(t=>t.level);
    fc.insertAdjacentHTML('beforeend',sparkline(vals,0,FLOOR.length-1));
    fc.insertAdjacentHTML('beforeend',`<div class="legend" style="justify-content:space-between;margin-top:4px">
      <span>${FLOOR[0]}</span><span>${FLOOR[FLOOR.length-1]}</span></div>`);
  }
  main.appendChild(fc);

  /* régularité 16 semaines */
  const hm=document.createElement('div'); hm.className='card';
  hm.innerHTML='<b style="font-size:15px">Régularité (16 semaines)</b><div class="heatwrap"><div class="heat"></div></div>';
  const heat=hm.querySelector('.heat');
  const mobDays=new Set(S.mobLog.map(m=>m.date));
  const jourDays=new Set(S.journal.map(j=>j.date));
  const today=new Date(); const dow=(today.getDay()+6)%7;
  const start=new Date(today); start.setDate(start.getDate()-dow-15*7);
  for(let i=0;i<16*7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const cell=document.createElement('i');
    if(d>today) cell.style.visibility='hidden';
    else {
      const m=mobDays.has(ds), j=jourDays.has(ds);
      if(m&&j) cell.style.background='var(--mix)';
      else if(m) cell.style.background='var(--acc)';
      else if(j) cell.style.background='var(--muscu)';
      if(m||j) cell.title=ds;
    }
    heat.appendChild(cell);
  }
  hm.insertAdjacentHTML('beforeend',`<div class="legend">
    <span><i style="background:var(--acc)"></i>Souplesse</span>
    <span><i style="background:var(--muscu)"></i>Journal</span>
    <span><i style="background:var(--mix)"></i>Les deux</span></div>`);
  main.appendChild(hm);
}

/* sparkline générique (min/max optionnels) */
function sparkline(vals,fmn,fmx){
  const w=320,h=110,pad=14;
  const mn=fmn!=null?fmn:Math.min(...vals), mx=fmx!=null?fmx:Math.max(...vals);
  const sx=i=>pad+(vals.length===1?(w/2-pad):i*(w-2*pad)/(vals.length-1));
  const sy=v=>mx===mn ? h/2 : h-pad-(v-mn)*(h-2*pad)/(mx-mn);
  const pts=vals.map((v,i)=>sx(i)+','+sy(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="var(--acc)"/>`).join('')}
  </svg>`;
}

/* ================================================================
   OVERLAY générique + utils
   ================================================================ */
const overlay=document.getElementById('overlay');
const overlayInner=document.getElementById('overlayInner');
function closeOverlay(){ overlay.classList.remove('open'); }
function openCustom(title,fill){
  overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`;
  overlayInner.querySelector('.back').onclick=closeOverlay;
  overlay.classList.add('open'); overlay.scrollTop=0;
  fill(overlayInner,closeOverlay);
}
function escapeH(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>'); }

/* ---------------- service worker (offline) ---------------- */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

/* ---------------- init ---------------- */
render();
</script>

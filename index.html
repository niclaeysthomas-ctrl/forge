<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href='data:application/manifest+json,{"name":"Forge","short_name":"Forge","display":"standalone","background_color":"#0c0d11","theme_color":"#0c0d11","start_url":"."}'>
<title>FORGE — boxe · calisthénie · hypertrophie</title>
<style>
  :root{
    --bg:#0c0d11; --bg2:#14161d; --bg3:#1c1f29; --line:#2a2e3c;
    --txt:#e9ebf2; --dim:#8a90a3;
    --acc:#f5b840; --accd:#e0891f;
    --boxe:#ff5c6c; --cali:#5b9cff; --hyper:#f5b840;
    --ok:#3ecf7a; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 130px}
  header{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:2px}
  .logo span{color:var(--acc)}
  .badges{display:flex;gap:8px}
  .badge{font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#191420,#241a2e);border:1px solid var(--line)}
  .hero .lvl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .hero .lvlname{font-size:22px;font-weight:800;margin:2px 0 10px;color:var(--acc)}
  .xpbar{height:8px;background:#0009;border-radius:4px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accd),var(--acc));border-radius:4px;transition:width .4s}
  .hero .xptxt{font-size:12px;color:var(--dim);margin-top:6px}

  .btn{display:inline-block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#1a1200;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;margin-top:0}
  .btn.danger{background:#3a1a20;color:var(--boxe);border:1px solid #55232c}
  .btn.ok{background:var(--ok);color:#02180b}
  h1.page{font-size:22px;font-weight:800;margin-bottom:14px}
  .sub{color:var(--dim);font-size:13px}

  /* type chips */
  .typegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
  .typebtn{border:1px solid var(--line);border-radius:var(--r);padding:16px 6px;text-align:center;cursor:pointer;background:var(--bg3)}
  .typebtn:active{transform:scale(.96)}
  .typebtn .i{font-size:26px;display:block;margin-bottom:6px}
  .typebtn b{font-size:13px}
  .tpl{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-top:8px;cursor:pointer;font-weight:700;font-size:14px}
  .tpl small{color:var(--dim);font-weight:400;display:block;font-size:12px}
  .tpl .del{margin-left:auto;color:var(--dim);padding:4px 8px}

  /* session */
  .sesshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sesshead b{font-size:18px}
  .sesshead .chrono{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700}
  .exo{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .exo .xh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .exo .xh b{flex:1;font-size:15px}
  .exo .xh .rm{color:var(--dim);padding:2px 8px;cursor:pointer}
  .exo .last{font-size:12px;color:var(--dim);margin-bottom:8px}
  .exo .last b{color:var(--acc)}
  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .setrow .sn{width:22px;text-align:center;color:var(--dim);font-weight:700;font-size:13px;flex-shrink:0}
  .fld{flex:1;display:flex;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .fld button{width:38px;height:42px;background:none;border:none;color:var(--dim);font-size:19px;font-weight:700;cursor:pointer;flex-shrink:0}
  .fld input{flex:1;width:30px;background:none;border:none;color:var(--txt);font-size:16px;font-weight:800;text-align:center;outline:none}
  .fld small{color:var(--dim);font-size:10px;padding-right:8px}
  .setrow .ck{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);
    font-size:17px;cursor:pointer;flex-shrink:0}
  .setrow.done .ck{background:#153524;color:var(--ok);border-color:#1d4a31}
  .setrow.done .fld{opacity:.55}
  .addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:9px;width:100%;
    font-size:13px;font-weight:700;cursor:pointer}

  /* boxing */
  .rt{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;text-align:center}
  .rt .time{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .rt .phase{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
  .rt.work{border-color:var(--boxe)} .rt.work .phase{color:var(--boxe)}
  .rt.rest{border-color:var(--ok)} .rt.rest .phase{color:var(--ok)}
  .rt .rounds{color:var(--dim);font-size:13px;margin-top:2px;font-weight:700}
  .rtcfg{display:flex;gap:8px;justify-content:center;margin:10px 0}
  .rtcfg .cfg{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
  .rtcfg .cfg small{display:block;color:var(--dim);font-size:10px;font-weight:600}
  .rtcfg .cfg .v{display:flex;align-items:center;gap:8px}
  .rtcfg .cfg button{background:none;border:none;color:var(--dim);font-size:16px;font-weight:700;cursor:pointer;padding:0 4px}
  .blocrow{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:700}
  .blocrow .n{margin-left:auto;display:flex;align-items:center;gap:10px}
  .blocrow .n button{width:28px;height:28px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);
    color:var(--txt);font-weight:700;cursor:pointer}
  .rpe{display:flex;gap:5px;margin-top:8px}
  .rpe i{flex:1;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .rpe i.on{background:var(--boxe);color:#fff;border-color:var(--boxe)}

  /* history */
  .sess{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
  .sess .top{display:flex;align-items:center;gap:10px}
  .sess .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .sess .t{flex:1;min-width:0}
  .sess .t b{font-size:15px;display:block}
  .sess .t small{color:var(--dim);font-size:12px}
  .sess .meta{text-align:right;font-size:12px;color:var(--dim);flex-shrink:0}
  .sess .det{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:#c9cde0;line-height:1.7;display:none}
  .sess.open .det{display:block}
  .ic-boxe{background:#2e1a20;color:var(--boxe)} .ic-cali{background:#16233a;color:var(--cali)} .ic-hyper{background:#2e2415;color:var(--hyper)}

  /* progress */
  .heatwrap{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;margin-top:10px}
  .heat i{width:13px;height:13px;border-radius:3px;background:var(--bg3)}
  .prrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .prrow:last-child{border-bottom:none}
  .prrow .t{flex:1;min-width:0}
  .prrow b{font-size:14px;display:block}
  .prrow small{color:var(--dim);font-size:12px}
  .prrow .val{font-weight:800;color:var(--acc);font-size:15px;text-align:right}
  .prrow .val small{display:block;font-weight:600}
  .weekbars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:12px}
  .weekbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;text-align:center}
  .weekbars .stack{display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
  .weekbars .seg{border-radius:3px}
  .weekbars small{font-size:10px;color:var(--dim);font-weight:700}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--dim);font-weight:700}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  svg.chart{width:100%;height:130px;margin-top:8px}

  /* overlay / sheets */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .inner{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5}
  .topbar .back{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}
  .topbar b{font-size:16px}
  .search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);
    font-size:15px;outline:none;margin-bottom:12px}
  .pickrow{padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;cursor:pointer;display:flex;justify-content:space-between}
  .pickrow small{color:var(--dim)}
  .cat{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px;font-weight:700}

  /* rest bar */
  #restbar{position:fixed;bottom:64px;left:0;right:0;z-index:45;display:none}
  #restbar .in{max-width:520px;margin:0 auto;padding:0 12px}
  #restbar .box{background:#153524;border:1px solid #1d4a31;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
  #restbar b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--ok)}
  #restbar .bar{flex:1;height:6px;background:#0006;border-radius:3px;overflow:hidden}
  #restbar .bar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
  #restbar button{background:none;border:none;color:var(--dim);font-weight:700;cursor:pointer;font-size:13px}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,13,17,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;cursor:pointer}
  nav button .i{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}

  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--bg3);border:1px solid var(--acc);
    color:var(--txt);padding:12px 22px;border-radius:14px;font-weight:700;z-index:100;transition:transform .35s;font-size:15px;white-space:nowrap}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--acc)}
  .stat small{color:var(--dim);font-size:12px}
  .empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">FOR<span>GE</span></div>
    <div class="badges"><div class="badge" id="wkBadge">🔥 0 sem</div></div>
  </header>
  <main id="main"></main>
  <nav><div class="in">
    <button data-tab="train" class="on"><span class="i">⚒️</span>Entraîner</button>
    <button data-tab="hist"><span class="i">📜</span>Historique</button>
    <button data-tab="prog"><span class="i">📈</span>Progrès</button>
  </div></nav>
</div>
<div id="restbar"><div class="in"><div class="box">
  <b id="restT">1:30</b><div class="bar"><i id="restI"></i></div><button id="restSkip">Passer ›</button>
</div></div></div>
<div class="overlay" id="overlay"><div class="inner" id="overlayInner"></div></div>
<div id="toast"></div>

<script>
/* ================================================================
   FORGE — boxe · calisthénie · hypertrophie
   ================================================================ */

/* ---------------- données ---------------- */
const TYPES={
  boxe:{ico:'🥊',nom:'Boxe',col:'var(--boxe)',ic:'ic-boxe'},
  cali:{ico:'🤸',nom:'Calisthénie',col:'var(--cali)',ic:'ic-cali'},
  hyper:{ico:'🏋️',nom:'Hypertrophie',col:'var(--hyper)',ic:'ic-hyper'},
};
const LIB={
  cali:['Tractions','Tractions lestées','Chin-ups','Dips','Dips lestés','Pompes','Pompes diamant','Pompes archer',
    'Rows australiens','Handstand push-up','Pike push-up','Pistol squat','Squat sauté','Fentes','Muscle-up',
    'L-sit (sec)','Planche (sec)','Hollow hold (sec)','Burpees'],
  hyper:['Développé couché','Développé incliné','Développé militaire','Squat','Soulevé de terre','Soulevé de terre roumain',
    'Rowing barre','Rowing haltère','Tirage vertical','Tirage horizontal','Curl biceps','Curl marteau',
    'Extension triceps','Dips lestés','Élévations latérales','Face pull','Leg press','Leg curl','Leg extension',
    'Hip thrust','Mollets debout','Fentes haltères'],
};
const BOX_WORK=['Sac','Shadow boxing','Sparring','Technique','Pattes d\'ours','Corde à sauter','Cardio/footwork'];
const GRADES=[[0,'Poids mouche'],[200,'Poids coq'],[500,'Poids plume'],[900,'Poids léger'],[1400,'Super-léger'],
  [2000,'Poids welter'],[2800,'Poids moyen'],[3700,'Mi-lourd'],[4800,'Poids lourd'],[6200,'Champion']];
const BASE_TPL=[
  {name:'Pull — cali',type:'cali',exs:['Tractions','Rows australiens','Chin-ups']},
  {name:'Push — cali',type:'cali',exs:['Dips','Pompes','Pompes diamant']},
  {name:'Legs — cali',type:'cali',exs:['Pistol squat','Fentes','Squat sauté']},
  {name:'Push — salle',type:'hyper',exs:['Développé couché','Développé militaire','Élévations latérales','Extension triceps']},
  {name:'Pull — salle',type:'hyper',exs:['Rowing barre','Tirage vertical','Curl biceps','Face pull']},
  {name:'Legs — salle',type:'hyper',exs:['Squat','Soulevé de terre roumain','Leg curl','Hip thrust']},
];

/* ---------------- état ---------------- */
const DEFAULT={xp:0,sessions:[],cur:null,templates:[],customEx:[],pr:{},restDur:90};
let S=load();
function load(){ try{ return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem('forge')||'{}')); }catch(e){ return {...DEFAULT}; } }
function save(){ localStorage.setItem('forge',JSON.stringify(S)); }
const todayStr=()=>new Date().toISOString().slice(0,10);
function gradeOf(xp){ let cur=GRADES[0],next=null;
  for(const g of GRADES){ if(xp>=g[0]) cur=g; else {next=g;break;} } return {name:cur[1],base:cur[0],next}; }

/* streak = semaines consécutives avec ≥3 séances (semaine courante comptée si déjà ≥3) */
function weekKey(dateStr){
  const dt=new Date(dateStr+'T12:00:00');
  dt.setDate(dt.getDate()+3-((dt.getDay()+6)%7));
  const w1=new Date(dt.getFullYear(),0,4);
  const wn=1+Math.round(((dt-w1)/864e5-3+((w1.getDay()+6)%7))/7);
  return dt.getFullYear()*100+wn;
}
function weekShift(dateObj,weeks){ const d=new Date(dateObj); d.setDate(d.getDate()+7*weeks); return d; }
function streakWeeks(){
  const counts={};
  S.sessions.forEach(s=>{ const k=weekKey(s.date); counts[k]=(counts[k]||0)+1; });
  let streak=0, probe=new Date();
  if((counts[weekKey(todayStr())]||0)>=3){ streak=1; probe=weekShift(probe,-1); }
  else probe=weekShift(probe,-1);
  while((counts[weekKey(probe.toISOString().slice(0,10))]||0)>=3){ streak++; probe=weekShift(probe,-1); }
  return streak;
}
function updateHeader(){ document.getElementById('wkBadge').textContent='🔥 '+streakWeeks()+' sem'; }

/* ---------------- audio ---------------- */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function beep(f=880,dur=.12,vol=.4,when=0){
  const ctx=ac(),t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.02);
}
function bell(){ beep(660,.5,.5); beep(880,.5,.4,.05); if(navigator.vibrate)navigator.vibrate([120,60,120]); }
function tick(){ beep(1200,.05,.25); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------------- PR / stats ---------------- */
const epley=(w,r)=>Math.round(w*(1+r/30)*10)/10;
function setScore(st){ return st.w>0 ? epley(st.w,st.reps) : st.reps; }
function setLabel(st){ return st.w>0 ? st.w+'kg × '+st.reps : st.reps+' reps'; }
function prLabel(p){ return p.w>0 ? '~'+p.score+'kg 1RM ('+p.w+'×'+p.reps+')' : p.reps+' reps max'; }
function lastPerf(ex){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=(S.sessions[i].entries||[]).find(en=>en.ex===ex);
    if(e && e.sets.some(st=>st.done)) return {date:S.sessions[i].date, sets:e.sets.filter(st=>st.done)};
  }
  return null;
}

/* ---------------- timer de repos ---------------- */
const Rest={left:0,total:0,timer:null,
  start(sec){
    this.stop(); this.left=sec; this.total=sec;
    document.getElementById('restbar').style.display='block'; this.draw();
    this.timer=setInterval(()=>{
      this.left--;
      if(this.left<=0){ this.stop(); bell(); toast('💪 Repos terminé — série suivante.'); }
      else { if(this.left<=3) tick(); this.draw(); }
    },1000);
  },
  draw(){
    document.getElementById('restT').textContent=Math.floor(this.left/60)+':'+String(this.left%60).padStart(2,'0');
    document.getElementById('restI').style.width=(this.left/this.total*100)+'%';
  },
  stop(){ if(this.timer){clearInterval(this.timer);this.timer=null;} document.getElementById('restbar').style.display='none'; }
};
document.getElementById('restSkip').onclick=()=>Rest.stop();

/* ---------------- timer de rounds (boxe) ---------------- */
const RT={rounds:6,work:180,rest:60,on:false,phase:'idle',cur:0,left:0,timer:null,wl:null,
  async lock(){ try{ this.wl=await navigator.wakeLock?.request('screen'); }catch(e){} },
  unlock(){ try{ this.wl?.release(); this.wl=null; }catch(e){} },
  start(){
    this.on=true; this.cur=1; this.phase='work'; this.left=this.work; bell(); this.lock();
    this.timer=setInterval(()=>{
      this.left--;
      if(this.left===10 && this.phase==='work') beep(440,.3,.4); // les 10 dernières secondes
      if(this.left<=0){
        if(this.phase==='work'){
          if(this.cur>=this.rounds){ this.finish(); return; }
          this.phase='rest'; this.left=this.rest; bell();
        } else { this.cur++; this.phase='work'; this.left=this.work; bell(); }
      }
      this.render();
    },1000);
    this.render();
  },
  finish(){ this.stopTimer(); this.phase='done'; bell(); setTimeout(bell,400); this.render();
    toast('🥊 '+this.rounds+' rounds terminés.'); },
  stopTimer(){ this.on=false; if(this.timer){clearInterval(this.timer);this.timer=null;} this.unlock(); },
  reset(){ this.stopTimer(); this.phase='idle'; this.cur=0; this.render(); },
  el:null,
  render(){
    if(!this.el || !document.body.contains(this.el)) return;
    const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    const d=this.el;
    d.className='rt '+(this.phase==='work'?'work':this.phase==='rest'?'rest':'');
    d.querySelector('.phase').textContent= this.phase==='work'?'ROUND '+this.cur : this.phase==='rest'?'REPOS' : this.phase==='done'?'TERMINÉ':'PRÊT';
    d.querySelector('.time').textContent= this.phase==='idle' ? mm(this.work) : this.phase==='done' ? '🏁' : mm(this.left);
    d.querySelector('.rounds').textContent=this.rounds+' rounds · '+mm(this.work)+' / '+mm(this.rest);
    d.querySelector('.go').textContent= this.on ? '◼ Arrêter' : (this.phase==='done'?'↻ Refaire':'▶ GONG');
  }
};

function renderTrain(){

    <div class="xptxt">${S.xp} XP${g.next?` · ${g.next[0]-S.xp} XP avant « ${g.next[1]} »`:''} · cette semaine : <b style="color:${thisWeek>=3?'var(--ok)':'var(--boxe)'}">${thisWeek}/3 séances</b></div>
  </div>

    <b style="font-size:16px">Nouvelle séance</b>

      <div class="typebtn" data-t="cali"><span class="i">🤸</span><b>Calisthénie</b></div>

    </div>
    <div class="cat" style="margin-top:16px">Routines</div>
    <div id="tpls"></div>
  </div>`);
  main.querySelectorAll('.typebtn').forEach(b=>b.onclick=()=>startSession(b.dataset.t));
  const tp=main.querySelector('#tpls');
  [...BASE_TPL,...S.templates].forEach((t,i)=>{
    const custom=i>=BASE_TPL.length;
    const d=document.createElement('div'); d.className='tpl';

      ${custom?'<span class="del">✕</span>':''}`;
    d.onclick=e=>{

function startSession(type,tpl=null){
  S.cur={ type, name: tpl?tpl.name:TYPES[type].nom, start:Date.now(), date:todayStr(),
    entries: tpl? tpl.exs.map(ex=>({ex,sets:[mkSet(ex)]})) : [],
    blocs:[], rpe:0, notes:'' };
  save(); render();
}
function mkSet(ex){
  const lp=lastPerf(ex);
  if(lp){ const f=lp.sets[0]; return {reps:f.reps,w:f.w,done:false}; }
  return {reps:8,w:0,done:false};
}

/* ---------------- séance active ---------------- */
let chronoTimer=null;
function renderSession(){
  clearInterval(chronoTimer);
  const c=S.cur, T=TYPES[c.type];
  main.insertAdjacentHTML('beforeend',`
    <div class="sesshead">
      <b>${T.ico} ${c.name}</b><span class="chrono" id="chrono"></span>
    </div>

}

/* ----- muscu / cali ----- */
function renderLift(body){
  const c=S.cur;
  c.entries.forEach((en,ei)=>{
    const lp=lastPerf(en.ex);
    const d=document.createElement('div'); d.className='exo';
    const pr=S.pr[en.ex];
    d.innerHTML=`<div class="xh"><b>${en.ex}</b>${pr?`<small style="color:var(--dim);font-size:11px">🏆 ${prLabel(pr)}</small>`:''}<span class="rm">✕</span></div>
      <div class="last">${lp?`Dernière fois (${lp.date.slice(5).split('-').reverse().join('/')}) : <b>${lp.sets.map(setLabel).join(' · ')}</b> — bats ça.`:'Premier passage : pose une référence.'}</div>
      <div class="sets"></div>
      <button class="addset">+ série</button>`;
    d.querySelector('.rm').onclick=()=>{ if(confirm('Retirer '+en.ex+' ?')){ c.entries.splice(ei,1); save(); render(); } };
    const setsDiv=d.querySelector('.sets');
    en.sets.forEach((st,si)=>setsDiv.appendChild(setRow(en,st,si)));
    d.querySelector('.addset').onclick=()=>{
      const prev=en.sets[en.sets.length-1];
      en.sets.push({reps:prev?prev.reps:8, w:prev?prev.w:0, done:false});
      save(); render();
    };
    body.appendChild(d);
  });
  const add=document.createElement('button'); add.className='btn ghost'; add.textContent='+ Ajouter un exercice';
  add.onclick=()=>pickExercise(ex=>{ c.entries.push({ex,sets:[mkSet(ex)]}); save(); render(); });
  body.appendChild(add);
}
function setRow(en,st,si){
  const r=document.createElement('div'); r.className='setrow'+(st.done?' done':'');
  r.innerHTML=`<span class="sn">${si+1}</span>
    <div class="fld"><button data-a="r-">−</button><input type="number" inputmode="numeric" value="${st.reps}"><small>reps</small><button data-a="r+">+</button></div>
    <div class="fld"><button data-a="w-">−</button><input type="number" inputmode="decimal" value="${st.w}" step="2.5"><small>kg</small><button data-a="w+">+</button></div>
    <button class="ck">${st.done?'✓':'○'}</button>`;
  const [ri,wi]=r.querySelectorAll('input');
  ri.onchange=()=>{ st.reps=Math.max(0,+ri.value||0); save(); };
  wi.onchange=()=>{ st.w=Math.max(0,+wi.value||0); save(); };
  r.querySelectorAll('.fld button').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='r-') st.reps=Math.max(0,st.reps-1);
    if(b.dataset.a==='r+') st.reps++;
    if(b.dataset.a==='w-') st.w=Math.max(0,Math.round((st.w-2.5)*10)/10);
    if(b.dataset.a==='w+') st.w=Math.round((st.w+2.5)*10)/10;
    ri.value=st.reps; wi.value=st.w; save();
  });
  r.querySelector('.ck').onclick=()=>{
    st.done=!st.done; save();
    r.classList.toggle('done',st.done);
    r.querySelector('.ck').textContent=st.done?'✓':'○';
    if(st.done){ if(navigator.vibrate)navigator.vibrate(40); Rest.start(S.restDur); }
  };
  return r;
}
function pickExercise(cb){
  openCustom('Choisir un exercice',(inner,close)=>{
    inner.insertAdjacentHTML('beforeend',`<input class="search" placeholder="Rechercher ou créer…" id="q">`);
    const list=document.createElement('div'); inner.appendChild(list);
    const draw=q=>{
      list.innerHTML='';
      const cats = S.cur.type==='cali' ? ['cali','hyper'] : ['hyper','cali'];
      const ql=q.toLowerCase();
      cats.forEach(cat=>{
        const items=[...LIB[cat],...S.customEx].filter((v,i,a)=>a.indexOf(v)===i)
          .filter(x=>!ql||x.toLowerCase().includes(ql));
        if(cat!==cats[0] && !ql) return drawCat(TYPES[cat].nom+' (tout voir en tapant)',[]);
        drawCat(TYPES[cat].nom, cat===cats[0]?items:items);
      });
      function drawCat(title,items){
        if(!items.length && !ql) return;
        list.insertAdjacentHTML('beforeend',`<div class="cat">${title}</div>`);
        items.forEach(x=>{
          const lp=lastPerf(x);
          const row=document.createElement('div'); row.className='pickrow';
          row.innerHTML=`<span>${x}</span>${lp?`<small>${lp.sets.map(setLabel)[0]||''}</small>`:''}`;
          row.onclick=()=>{ cb(x); close(); };
          list.appendChild(row);
        });
      }
      if(ql && ![...LIB.cali,...LIB.hyper,...S.customEx].some(x=>x.toLowerCase()===ql)){
        const mk=document.createElement('div'); mk.className='pickrow';
        mk.innerHTML=`<span>＋ Créer « ${q} »</span>`;
        mk.onclick=()=>{ S.customEx.push(q); save(); cb(q); close(); };
        list.appendChild(mk);
      }
    };
    draw('');
    inner.querySelector('#q').oninput=e=>draw(e.target.value.trim());
  });
}

/* ----- boxe ----- */
function renderBoxe(body){
  const c=S.cur;
  const rt=document.createElement('div'); rt.className='rt';
  rt.innerHTML=`<div class="phase">PRÊT</div><div class="time">3:00</div><div class="rounds"></div>
    <div class="rtcfg">
      <div class="cfg"><small>rounds</small><div class="v"><button data-k="rounds" data-d="-1">−</button><span>${RT.rounds}</span><button data-k="rounds" data-d="1">+</button></div></div>
      <div class="cfg"><small>travail</small><div class="v"><button data-k="work" data-d="-30">−</button><span>${RT.work/60}m</span><button data-k="work" data-d="30">+</button></div></div>
      <div class="cfg"><small>repos</small><div class="v"><button data-k="rest" data-d="-15">−</button><span>${RT.rest}s</span><button data-k="rest" data-d="15">+</button></div></div>
    </div>
    <button class="btn go">▶ GONG</button>`;
  RT.el=rt;
  rt.querySelectorAll('.rtcfg button').forEach(b=>b.onclick=()=>{
    if(RT.on) return;
    const k=b.dataset.k, d=+b.dataset.d;
    if(k==='rounds') RT.rounds=Math.max(1,Math.min(20,RT.rounds+d));
    if(k==='work') RT.work=Math.max(30,Math.min(600,RT.work+d));
    if(k==='rest') RT.rest=Math.max(15,Math.min(180,RT.rest+d));
    b.parentElement.querySelector('span').textContent= k==='rounds'?RT.rounds : k==='work'?(RT.work/60)+'m' : RT.rest+'s';
    RT.render();
  });
  rt.querySelector('.go').onclick=()=>{
    if(RT.on){ if(confirm('Arrêter le timer ?')) RT.reset(); }
    else { RT.reset(); RT.start(); }
  };
  RT.render();
  body.appendChild(rt);

  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<b style="font-size:15px">Travail effectué</b><div id="blocs" style="margin-top:10px"></div><div class="selwrap"></div>`;
  const blocsDiv=card.querySelector('#blocs');
  const drawBlocs=()=>{
    blocsDiv.innerHTML='';
    c.blocs.forEach((bl,bi)=>{
      const d=document.createElement('div'); d.className='blocrow';
      d.innerHTML=`<span>${bl.type}</span><div class="n">
        <button data-d="-1">−</button><span>${bl.rounds} rd</span><button data-d="1">+</button></div>`;
      d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        bl.rounds+= +b.dataset.d;
        if(bl.rounds<=0) c.blocs.splice(bi,1);
        save(); drawBlocs();
      });
      blocsDiv.appendChild(d);
    });
    const addRow=document.createElement('div');
    addRow.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:6px';
    BOX_WORK.filter(w=>!c.blocs.some(b=>b.type===w)).forEach(w=>{
      const t=document.createElement('button'); t.className='btn small ghost'; t.textContent='+ '+w;
      t.onclick=()=>{ c.blocs.push({type:w,rounds:3}); save(); drawBlocs(); };
      addRow.appendChild(t);
    });
    blocsDiv.appendChild(addRow);
  };
  drawBlocs();
  body.appendChild(card);

  const rpe=document.createElement('div'); rpe.className='card';
  rpe.innerHTML=`<b style="font-size:15px">Intensité ressentie (RPE)</b>
    <div class="rpe">${[...Array(10)].map((_,i)=>`<i data-v="${i+1}" class="${c.rpe===i+1?'on':''}">${i+1}</i>`).join('')}</div>`;
  rpe.querySelectorAll('.rpe i').forEach(el=>el.onclick=()=>{
    c.rpe=+el.dataset.v; save();
    rpe.querySelectorAll('.rpe i').forEach(x=>x.classList.toggle('on',+x.dataset.v===c.rpe));
  });
  body.appendChild(rpe);
}

/* ----- fin de séance ----- */
function finishSession(){
  const c=S.cur;
  if(c.type!=='boxe'){
    c.entries=c.entries.map(en=>({...en,sets:en.sets.filter(st=>st.done)})).filter(en=>en.sets.length);
    if(!c.entries.length) return toast('Valide au moins une série (✓) avant de terminer.');
  } else {
    if(RT.cur>0 && !c.blocs.length) c.blocs.push({type:'Sac',rounds:RT.cur});
    if(!c.blocs.length) return toast('Ajoute au moins un bloc de travail.');
  }
  c.dur=Math.max(1,Math.round((Date.now()-c.start)/60000));
  // PRs
  const newPRs=[];
  if(c.type!=='boxe'){
    c.entries.forEach(en=>en.sets.forEach(st=>{
      const sc=setScore(st), old=S.pr[en.ex];
      if(!old || sc>old.score){
        S.pr[en.ex]={score:sc,reps:st.reps,w:st.w,date:c.date};
        if(!newPRs.includes(en.ex)) newPRs.push(en.ex);
      }
    }));
  }
  const xp=30+newPRs.length*10;
  S.xp+=xp;
  const sess={id:Date.now(),date:c.date,type:c.type,name:c.name,dur:c.dur,
    entries:c.entries||[],blocs:c.blocs||[],rpe:c.rpe||0,prs:newPRs};
  S.sessions.push(sess);
  S.cur=null; save(); Rest.stop(); RT.reset(); updateHeader();
  // résumé
  openCustom('Séance terminée',(inner,close)=>{
    const vol = sess.type==='boxe'
      ? sess.blocs.reduce((a,b)=>a+b.rounds,0)+' rounds'
      : sess.entries.reduce((a,e)=>a+e.sets.length,0)+' séries · '+
        (sess.entries.some(e=>e.sets.some(st=>st.w>0))
          ? Math.round(sess.entries.reduce((a,e)=>a+e.sets.reduce((x,st)=>x+st.w*st.reps,0),0))+' kg soulevés'
          : sess.entries.reduce((a,e)=>a+e.sets.reduce((x,st)=>x+st.reps,0),0)+' reps');
    inner.insertAdjacentHTML('beforeend',`
      <div style="text-align:center;padding:10px 0 6px">
        <div style="font-size:52px">${TYPES[sess.type].ico}</div>
        <div style="font-size:22px;font-weight:800;margin:6px 0">${sess.name}</div>
        <p class="sub">${sess.dur} min · ${vol}</p>
        <div style="font-size:17px;font-weight:800;color:var(--acc);margin-top:12px">+${xp} XP</div>
        ${newPRs.length?`<div style="margin-top:14px;background:var(--bg2);border:1px solid var(--acc);border-radius:12px;padding:12px">
          🏆 <b>Record${newPRs.length>1?'s':''} battu${newPRs.length>1?'s':''} :</b> ${newPRs.map(e=>e+' ('+prLabel(S.pr[e])+')').join(' · ')}</div>`:''}
      </div>`);
    if(sess.type!=='boxe'){
      const tb=document.createElement('button'); tb.className='btn ghost'; tb.textContent='💾 Sauvegarder comme routine';
      tb.onclick=()=>{
        const name=prompt('Nom de la routine :',sess.name);
        if(name){ S.templates.push({name,type:sess.type,exs:sess.entries.map(e=>e.ex)}); save(); toast('Routine « '+name+' » créée.'); tb.remove(); }
      };
      inner.appendChild(tb);
    }
    const ok=document.createElement('button'); ok.className='btn'; ok.textContent='OK';
    ok.onclick=close; inner.appendChild(ok);
  });
  bell();
}

/* ================================================================
   ONGLET PROGRÈS
   ================================================================ */
function renderProg(){
  main.insertAdjacentHTML('beforeend','<h1 class="page">Progrès</h1>');
  const wk=weekKey(todayStr());
  const thisWeek=S.sessions.filter(s=>weekKey(s.date)===wk).length;
  const totMin=S.sessions.reduce((a,s)=>a+s.dur,0);

  main.insertAdjacentHTML('beforeend',`<div class="statgrid">
    <div class="stat"><b>${S.sessions.length}</b><small>séances au total</small></div>
    <div class="stat"><b>${streakWeeks()}</b><small>semaines de streak (≥3)</small></div>
    <div class="stat"><b>${thisWeek}/3</b><small>cette semaine</small></div>
    <div class="stat"><b>${Math.round(totMin/60*10)/10}h</b><small>temps total</small></div>
  </div>`);

  /* heatmap 16 semaines */
  const hm=document.createElement('div'); hm.className='card'; hm.style.marginTop='12px';
  hm.innerHTML='<b style="font-size:15px">Régularité (16 semaines)</b><div class="heatwrap"><div class="heat"></div></div>';
  const heat=hm.querySelector('.heat');
  const byDay={};
  S.sessions.forEach(s=>{ (byDay[s.date]=byDay[s.date]||[]).push(s.type); });
  const today=new Date(); const dow=(today.getDay()+6)%7;
  const start=new Date(today); start.setDate(start.getDate()-dow-15*7);
  for(let i=0;i<16*7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const cell=document.createElement('i');
    if(d>today) cell.style.visibility='hidden';
    else if(byDay[ds]){
      const t=byDay[ds][0];
      cell.style.background= byDay[ds].length>1 ? 'var(--acc)' : `var(--${t})`;
      cell.title=ds;
    }
    heat.appendChild(cell);
  }
  hm.insertAdjacentHTML('beforeend',`<div class="legend">
    <span><i style="background:var(--boxe)"></i>Boxe</span>
    <span><i style="background:var(--cali)"></i>Cali</span>
    <span><i style="background:var(--hyper)"></i>Hyper</span>
    <span><i style="background:var(--acc)"></i>Multi</span></div>`);
  main.appendChild(hm);

  /* volume hebdo 8 semaines */
  const vb=document.createElement('div'); vb.className='card';
  vb.innerHTML='<b style="font-size:15px">Séances par semaine</b>';
  const bars=document.createElement('div'); bars.className='weekbars';
  const weeks=[...Array(8)].map((_,k)=>{
    const ref=weekShift(new Date(),k-7);
    const key=weekKey(ref.toISOString().slice(0,10));
    const ss=S.sessions.filter(s=>weekKey(s.date)===key);
    return {label:k===7?'now':'S-'+(7-k), counts:['boxe','cali','hyper'].map(t=>ss.filter(s=>s.type===t).length)};
  });
  const mx=Math.max(...weeks.map(w=>w.counts.reduce((a,b)=>a+b,0)),3);
  weeks.forEach(w=>{
    const col=document.createElement('div'); col.className='col';
    const stack=document.createElement('div'); stack.className='stack';
    ['boxe','cali','hyper'].forEach((t,ti)=>{
      if(!w.counts[ti]) return;
      const seg=document.createElement('div'); seg.className='seg';
      seg.style.cssText=`background:var(--${t});height:${w.counts[ti]/mx*70}px`;
      stack.appendChild(seg);
    });
    col.appendChild(stack);
    col.insertAdjacentHTML('beforeend',`<small>${w.label}</small>`);
    bars.appendChild(col);
  });
  vb.appendChild(bars);
  main.appendChild(vb);

  /* records */
  const prc=document.createElement('div'); prc.className='card';
  prc.innerHTML='<b style="font-size:15px">🏆 Records</b>';
  const prs=Object.entries(S.pr);
  if(!prs.length) prc.insertAdjacentHTML('beforeend','<div class="empty">Valide des séries : les records tomberont tout seuls.</div>');
  else prs.sort((a,b)=>b[1].date.localeCompare(a[1].date)).forEach(([ex,p])=>{
    const row=document.createElement('div'); row.className='prrow';
    row.innerHTML=`<div class="t"><b>${ex}</b><small>depuis le ${p.date.split('-').reverse().join('/')}</small></div>
      <div class="val">${p.w>0?'~'+p.score+' kg':p.reps+' reps'}<small>${p.w>0?p.w+'kg × '+p.reps:'max'}</small></div>`;
    row.onclick=()=>exoDetail(ex);
    prc.appendChild(row);
  });
  main.appendChild(prc);
}

/* détail d'un exercice : courbe + historique */
function exoDetail(ex){
  openCustom(ex,(inner)=>{
    const pts=[];
    S.sessions.forEach(s=>{
      const en=(s.entries||[]).find(e=>e.ex===ex);
      if(!en||!en.sets.length) return;
      pts.push({date:s.date, best:Math.max(...en.sets.map(setScore)), sets:en.sets});
    });
    if(!pts.length){ inner.insertAdjacentHTML('beforeend','<div class="empty">Pas encore de données.</div>'); return; }
    const p=S.pr[ex];
    inner.insertAdjacentHTML('beforeend',`<div class="card"><b style="font-size:15px">🏆 ${prLabel(p)}</b>
      <p class="sub">La courbe = ta meilleure série de chaque séance${pts[0].sets[0].w>0?' (1RM estimé)':' (reps)'}. Elle doit monter.</p>
      ${sparkline(pts.map(x=>x.best))}</div>`);
    const h=document.createElement('div'); h.className='card';
    h.innerHTML='<b style="font-size:15px">Historique</b>';
    [...pts].reverse().forEach(pt=>{
      h.insertAdjacentHTML('beforeend',`<div class="prrow"><div class="t">
        <b>${pt.sets.map(setLabel).join(' · ')}</b><small>${pt.date.split('-').reverse().join('/')}</small></div>
        <div class="val">${pt.best}</div></div>`);
    });
    inner.appendChild(h);
  });
}
function sparkline(vals){
  const w=320,h=110,pad=12;
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const sx=i=>pad+(vals.length===1?w/2-pad:i*(w-2*pad)/(vals.length-1));
  const sy=v=>mx===mn ? h/2 : h-pad-(v-mn)*(h-2*pad)/(mx-mn);
  const ptsStr=vals.map((v,i)=>sx(i)+','+sy(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <polyline points="${ptsStr}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="var(--acc)"/>`).join('')}
    <text x="${pad}" y="${sy(vals[0])-8}" fill="var(--dim)" font-size="10">${vals[0]}</text>
    <text x="${sx(vals.length-1)}" y="${sy(vals[vals.length-1])-8}" fill="var(--acc)" font-size="11" font-weight="800" text-anchor="end">${vals[vals.length-1]}</text>
  </svg>`;
}

/* ================================================================
   OVERLAY
   ================================================================ */
const overlay=document.getElementById('overlay');
const overlayInner=document.getElementById('overlayInner');
function closeOverlay(){ overlay.classList.remove('open'); render(); }
function openCustom(title,fill){
  overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`;
  overlayInner.querySelector('.back').onclick=closeOverlay;
  overlay.classList.add('open'); overlay.scrollTop=0;
  fill(overlayInner,closeOverlay);
}

/* ---------------- init ---------------- */
updateHeader(); render();
</script>
